name: Approved Newsletter Publisher

on:
  push:
    branches: [main]
    paths:
      - 'editorial/issues/**'
      - 'scripts/editorial_issue.py'
      - 'scripts/publish_editorial_issue.py'
  schedule:
    # Tuesday 08:05 UTC. Supabase controls the exact 08:00 UTC publication time;
    # this run refreshes public SEO assets after the issue becomes eligible.
    - cron: '5 8 * * 2'
  workflow_dispatch:
    inputs:
      issue_path:
        description: 'Optional approved issue directory. Blank stages every approved package.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: approved-newsletter-publisher
  cancel-in-progress: false

jobs:
  stage-approved-newsletters:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic build dependencies
        run: pip install reportlab Pillow

      - name: Validate, build, and stage approved issue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ISSUE_PATH: ${{ github.event.inputs.issue_path || '' }}
        run: |
          if [ -n "$ISSUE_PATH" ]; then
            python scripts/publish_editorial_issue.py "$ISSUE_PATH"
          else
            python scripts/publish_editorial_issue.py --all-approved
          fi

      - name: Generate public discovery assets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          SLUG=$(cat /tmp/newsletter_slug.txt 2>/dev/null || true)
          TITLE=$(cat /tmp/newsletter_title.txt 2>/dev/null || true)
          if [ -n "$SLUG" ] && [ -n "$TITLE" ]; then
            python scripts/generate_og_images.py --slug "$SLUG" --title "$TITLE"
          fi
          python scripts/generate_sitemap_rss.py
          python scripts/prerender_newsletters.py
          python scripts/generate_playbook_manifest.py

      - name: Commit generated assets
        run: |
          git config user.name "Churn Is Dead Publisher"
          git config user.email "newsletter@churnisdead.com"
          git add public/pdfs/*.pdf public/pdfs/manifest.json public/sitemap.xml public/rss.xml public/og/*.png public/newsletter/ public/distribution/ distribution/
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          TITLE=$(cat /tmp/newsletter_title.txt 2>/dev/null || echo "Approved newsletter")
          git commit -m "chore: stage ${TITLE}"
          git pull --rebase origin main
          git push origin main
