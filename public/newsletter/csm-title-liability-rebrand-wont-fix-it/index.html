      <p style="font-size:11px;letter-spacing:3px;color:#C8553D;font-weight:bold;text-transform:uppercase">CHURN IS DEAD</p>
      <h1 style="font-family:Helvetica,Arial,sans-serif;font-size:32px">The CSM Title Is Now a Liability. The Rebrand Everyone&#x27;s Reaching For Won&#x27;t Fix It.</h1>
      <p style="color:#999;font-size:13px">11 min read · Team Design</p>
      <h2>The 60-Second Version</h2>
      <p>Buyers didn&#x27;t go defensive on &quot;customer success&quot; because of the word. They went defensive because the job quietly became a commercial one wearing a relationship costume, and they can smell it.</p>
      <p>Renaming CSMs to Forward Deployed Engineers doesn&#x27;t retire the <strong>credibility debt</strong> the role ran up. It just relocates the debt to the renewal, where the customer discovers your FDE has a number too.</p>
      <p>This week: run a one-page audit that maps each customer-facing role to what the customer actually experiences before you draft the reorg memo.</p>
      <hr>
      <p>Two candidates in two and a half months. That was the entire recruiting pipeline one AI company got against a req for &quot;head of customer success,&quot; a story Assembly AI&#x27;s Ryan Seams told from the stage at SaaStr AI 2026. Same job description. Same scope. Same money. They changed the title to &quot;forward deployed engineer&quot; and the pipeline filled overnight.</p>
      <p>If you run a post-sales org, you have already forwarded that anecdote to someone. It confirmed a thing you&#x27;d been feeling for a year. The word &quot;success&quot; has gone radioactive with technical buyers, and here is proof that swapping it for a title borrowed from Palantir&#x27;s deployment teams solves your talent problem in a weekend.</p>
      <p>It does solve your talent problem. That part is real and I won&#x27;t argue it.</p>
      <p>What I want to sit with is the second half of the story, the half that doesn&#x27;t fit on a slide. The candidate side of the funnel filled up. The customer side of the equation did not change at all. And the customer is the one holding the pen at renewal.</p>
      <p>The rebrand is a tell. It tells you the role accumulated a debt nobody paid down. A new title is you refinancing that debt at a worse rate and hoping the balance doesn&#x27;t come due before your reorg gets celebrated.</p>
      <hr>
      <h2>What actually broke</h2>
      <p>Here is the thing the discourse keeps getting wrong. It treats &quot;customer success&quot; as a branding accident, a word that aged badly, like calling a role &quot;webmaster&quot; in 2026.</p>
      <p>It isn&#x27;t a branding accident. The title was an accurate label. Somewhere between 2019 and now, the job it described changed underneath the word.</p>
      <p>CS started reporting to the CRO. Net revenue retention became the only number anyone tracked at board level. Variable comp got bolted onto expansion. The role that was sold to customers as &quot;your advocate inside the vendor&quot; was now measured, promoted, and paid on how much more it could extract from them.</p>
      <p>Buyers figured this out. Not because they read your comp plan, but because they sat across from enough CSMs whose &quot;strategic check-in&quot; always found its way to a seat count by minute forty. They learned that the person introduced as their partner had a quota with their logo on it.</p>
      <p>That is what &quot;customer success&quot; now signals to a sharp technical buyer. Not incompetence. Not fluff. A disguised commercial motion pointed at them.</p>
      <p>So when you rename the role, you are not fixing what broke. You are choosing a word the customer hasn&#x27;t yet learned to distrust. They will learn. It takes about one renewal cycle.</p>
      <p><strong>A rename is what you reach for when you can&#x27;t afford the thing the rename is describing.</strong></p>
      <hr>
      <h2>The broken state, drawn from what I actually see</h2>
      <p>I run enterprise accounts. Let me tell you what the debt looks like from inside a real book of business, not a composite.</p>
      <p>The pattern repeats across companies that sell per-seat or per-license software with expansion targets set by sales. The CSM inherits a large account after a handoff where the salesperson promised outcomes the product can&#x27;t yet deliver. Week one is a fire drill: a P1 escalation that belongs to support, a renewal that was sandbagged into the CSM&#x27;s lap, a champion who just left for a competitor.</p>
      <p>The CSM&#x27;s calendar is 80 percent reactive. The &quot;proactive strategic advisor&quot; motion the job description promised happens for maybe the top three accounts, on a good month.</p>
      <p>Bobby Cooper&#x27;s Retention Intelligence data, presented at that same SaaStr event, found that more than 50 percent of CSM activity has zero correlation with retention. Read that carefully. It doesn&#x27;t mean CSMs are lazy. It means the org structure forces them to absorb work that belongs to support, to sales, and to product, and none of that absorbed work moves the number they&#x27;re judged on.</p>
      <p>Now layer the comp plan on top. This CSM has an expansion target. Every genuine relationship they build gets metabolised by the org into a lever. The moment the customer senses that lever, the relationship stops being a relationship and becomes a negotiation the customer manages carefully.</p>
      <p>That is the handoff from trusted to managed. And it is the exact moment the credibility debt got borrowed. Not at the rename. Long before it.</p>
      <p>When this org rebrands the role to FDE, nothing about that structure changes. The comp plan survives. The expansion target survives. The customer meets a person in an engineer&#x27;s title with a salesperson&#x27;s number, and the gap between the title and the incentive is the widest it has ever been. You didn&#x27;t close the debt. You disguised it, which makes the discovery worse.</p>
      <hr>
      <h2>The Credibility Debt: a four-part audit</h2>
      <p>Before you send the reorg memo, run each customer-facing role through this. It takes an afternoon. It will change what you write.</p>
      <p><strong>1. The Commission Question.</strong> Does this role have a number the customer can smell? Not &quot;does it have a quota on paper,&quot; but does the customer, in the room, feel the pull toward a commercial outcome? If the answer is yes, no title on earth hides it. The FDE title with a renewal target is a salesperson in a lab coat, and the customer will find the coat pockets. If you want the engineer title to mean something, the role either owns a technical outcome with no commercial pull, or it owns commercial with an honest name. The dishonest middle is where the debt lives.</p>
      <p><strong>2. The Deliverable Test.</strong> Can this person produce an outcome the customer could not have gotten from your sales team? This is the one most orgs fail. Palantir invented the forward deployed engineer to embed a person who wrote code against the customer&#x27;s actual data and shipped a working thing. The title described a deliverable. When you borrow the title without borrowing the deliverable, you have an empty label. Ask the hard version: of the &quot;value&quot; your CS org claims to deliver, what fraction is shippable technical work versus narration of value that already existed? At most SaaS companies the honest answer is that the shippable fraction is small, and the rest is relationship management describing outcomes the product produced on its own. That&#x27;s fine. It&#x27;s just not an engineer.</p>
      <p><strong>3. The Handoff Scar.</strong> Every place the customer got passed from &quot;trusted&quot; to &quot;sold to&quot; is a place the debt was borrowed. Map them. Sales to onboarding. Onboarding to CSM. CSM to renewals. Renewals back to sales for expansion. Each handoff where the tone shifts from advocacy to ask leaves a scar, and the customer remembers every one. Gainsight&#x27;s new &quot;Handoff Analyst&quot; agent, launched at Pulse this year, exists because the sales-to-CS handoff is where enterprise relationships go to die. That&#x27;s a real pain worth automating. But automating the reconstruction of goals doesn&#x27;t repair the trust that snapped when the customer felt the handoff. The scar is relational, not informational.</p>
      <p><strong>4. The Repayment Motion.</strong> You don&#x27;t earn a new title by announcing it. You earn it by shipping the technical outcome first, then letting the customer name what you are. Deliver first, get named second, monetise third. If you invert that order, if you claim the engineer title before you&#x27;ve shipped an engineer&#x27;s outcome, you&#x27;re spending credibility you haven&#x27;t earned and the balance comes due at renewal.</p>
      <p><strong>Deliver first, get named second, monetise third.</strong> That&#x27;s the whole repayment plan in six words. Print it above the reorg draft.</p>
      <hr>
      <h2>What a real FDE org actually costs</h2>
      <p>Here is the part the rebrand crowd skips, because it&#x27;s the expensive part.</p>
      <p>A true forward deployed engineer is not a retitled CSM. It&#x27;s a person who can sit inside a customer&#x27;s environment, understand their data model, and build or configure a working outcome against it. That person is loaded expensive. SaaStr&#x27;s own operating guidance and the market for the profile put it well north of what a relationship-first CSM costs, which is exactly why most orgs can&#x27;t afford to make everyone one.</p>
      <p>So they don&#x27;t. They ration. The real FDEs go to accounts above some ACV or headcount threshold, and everyone below the line gets the title without the substance, or gets a Slack channel and an automated check-in.</p>
      <p>The disciplined version, the one that actually works, is the one every complex AI deployment SaaStr runs well shares in common: hire one strong FDE, embed them with your top handful of accounts, document exactly what they do during deployment, systematise it into a playbook, then let CSMs or implementation specialists run the proven process. The CSM&#x27;s job becomes maintaining the relationship after the deployment is genuinely solved, not heroically pretending to solve deployments they can&#x27;t.</p>
      <p>Notice what that model does to the four audit dimensions. It gives the FDE a real deliverable. It removes the commercial pull from the technical role. It repairs the handoff scar because the person who shows up actually ships something. And it earns the title in the right order.</p>
      <p>The counter-pattern, mass-converting your CSMs into pseudo-engineers overnight, tanks both roles. You lose the relationship coverage you had and you don&#x27;t gain the implementation depth you claimed. You get a book of business full of people with an engineer&#x27;s title, a salesperson&#x27;s quota, and a CSM&#x27;s toolkit, which is three jobs and zero credibility.</p>
      <hr>
      <h2>The two markets you&#x27;re trading between</h2>
      <p>The rebrand wins one market and loses another. The recruiting market and the customer market are not the same market, and a title behaves differently in each.</p>
      <p>In the recruiting market, &quot;forward deployed engineer&quot; is a promotion. It reads as technical, senior, adjacent to product. Candidates who wouldn&#x27;t touch a CS req apply. Your funnel fills. Real win.</p>
      <p>In the customer market, the title makes a promise. It says: this person ships. When the person doesn&#x27;t ship, the title becomes a liability that the plain word &quot;CSM&quot; never was, because &quot;CSM&quot; promised less and therefore disappointed less.</p>
      <p>Most orgs running this reorg right now are about to win the recruiting market and lose the customer market, and they&#x27;ll call the whole thing a transformation. The recruiting win shows up this quarter, visible, celebrated, attributed. The customer loss shows up two renewals later, diffuse, hard to trace, by which point the person who ran the reorg has moved on with the win on their record.</p>
      <p>That lag is why credibility debt is dangerous. Like all debt, the person who borrows it is rarely the person who repays it.</p>
      <hr>
      <h2>Do this before you rename anything</h2>
      <p>1. <strong>Run the audit on paper.</strong> Take every customer-facing role and score it against the four dimensions. Be honest about the Deliverable Test. If the role can&#x27;t produce an outcome the customer couldn&#x27;t get from sales, no engineer title will survive contact with the customer.</p>
      <p>2. <strong>Find your handoff scars.</strong> Walk one real account&#x27;s journey from signed contract to first renewal and mark every point the tone shifted from advocacy to ask. Those are your debt origination points. Fix the worst one before you touch a title.</p>
      <p>3. <strong>Decouple the number from the technical role, or keep the honest name.</strong> If you want an FDE title to mean something, that role cannot carry a renewal target the customer can feel. Pick one. Commercial with an honest name, or technical with a real deliverable. Never the dishonest middle.</p>
      <p>4. <strong>Hire one real FDE and watch what happens at renewal.</strong> Before you convert the org, embed a single genuine forward deployed engineer with your top accounts and measure the renewal outcome against your CSM-covered accounts. Let the data tell you whether you&#x27;re buying a deliverable or a costume.</p>
      <p>5. <strong>Let the customer name the role.</strong> Ship the outcome first. When a customer refers to your person as &quot;basically our engineer,&quot; you&#x27;ve earned the title. Put that in the reorg memo instead of the other way around.</p>
      <hr>
      <p>The honest version of this transformation is harder and slower and more expensive than the rename. It requires you to build a deliverable, not borrow a word. It requires you to touch the comp plan, which nobody wants to touch. It requires you to pay down the debt instead of refinancing it.</p>
      <p>But here&#x27;s what I&#x27;d ask the leader with the reorg memo half-written. Your candidates went defensive at &quot;customer success&quot; for a reason that had nothing to do with the word. What makes you think your customers will stay comfortable with the new word once they learn what it&#x27;s incentivised to do?</p>
      <p>Rename the role if you want to fill the funnel. Just don&#x27;t confuse a full funnel with a paid-down debt. The customer keeps the ledger, and the customer collects at renewal.</p>
