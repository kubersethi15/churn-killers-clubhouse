      <p style="font-size:11px;letter-spacing:3px;color:#C8553D;font-weight:bold;text-transform:uppercase">CHURN IS DEAD</p>
      <h1 style="font-family:Helvetica,Arial,sans-serif;font-size:32px">Your Best Customer Is Not Your Reference Desk</h1>
      <p style="color:#999;font-size:13px">7 min read · Customer Growth</p>
      <p>The sales team has a deal that might close this week. The buyer wants to hear from someone already using the product. There is one obvious name.</p>
      <p>That customer likes the product. She spoke at your event a few months ago. She helped with a story for the website. The account owner thinks she&#x27;ll say yes to a call.</p>
      <p>Then the request comes in: &quot;Can she speak to this prospect tomorrow?&quot;</p>
      <p>This is a made-up situation, not a real customer story. But the choice is familiar to anyone in Customer Success (CS). A customer was happy to help once. Does that make her the person to call every time a deal needs proof?</p>
      <p>I don&#x27;t think it does.</p>
      <p>The customer may still want to help. The prospect may have a fair question. The mistake is to treat the customer&#x27;s earlier yes as permission for a different ask, on a different day, for a different purpose.</p>
      <p><strong>A good reference request starts with what the customer is being asked to give, not what your team needs to close.</strong></p>
      <h2>The prospect&#x27;s question matters</h2>
      <p>The easiest way to mishandle this is to make it a fight between CS and Sales. Sales says the call matters. CS says the customer is busy. Both could be right.</p>
      <p>Start with the buyer&#x27;s actual question. Are they unsure whether the product works in a similar environment? Do they want to know how long setup took? Are they worried that support disappears after signing? Those are different questions. A call with a happy customer won&#x27;t answer all of them.</p>
      <p>If the question is about a feature, a product expert might be better. If it is about the first month of rollout, an existing story or a conversation with the implementation team may do the job. If the buyer wants to hear the trade-offs from a peer, a customer call might be worth asking for.</p>
      <p>That distinction helps the customer too. Nobody should spend half an hour on a call only to discover that the buyer needed a technical answer they couldn&#x27;t give.</p>
      <p>The account owner should be able to say why this particular customer is a fit. &quot;She&#x27;s our happiest customer&quot; isn&#x27;t enough. What has she done that matches the buyer&#x27;s situation? What can she speak about comfortably? And what should stay out of the conversation?</p>
      <h2>A yes to one thing is not a yes to everything</h2>
      <p>A logo on a slide, a quote in a case study and a live call each ask something different of the customer. One uses a name. One uses their words. One uses their time, often with no chance to rehearse the questions.</p>
      <p><a href="https://handbook.gitlab.com/handbook/marketing/growth-marketing/growth-community-programs/">GitLab&#x27;s public customer advocacy process</a> treats customer names, logos, quotes, stories and speaking opportunities as separate kinds of reference. It says references should be secured in writing and asks its team to check whether a potential speaker has already been used too often. Its event lead times are GitLab&#x27;s own, not a rule for every CS team.</p>
      <p>GitLab also describes <a href="https://handbook.gitlab.com/handbook/marketing/developer-relations/programs/operational-guidelines/">explicit, documented agreement for different reference activities</a> in one of its programmes. That is a useful operating reminder. It isn&#x27;t legal advice: your company still needs to follow its own contracts and approval process.</p>
      <p>The practical question for CS is simpler. Before anybody approaches the customer, what exactly are we asking them to do? Where will their name or words appear? Who will hear them? How long will it take? What can they say no to?</p>
      <p>&quot;They agreed to be a reference&quot; may be true in some limited sense. It does not tell you whether they agreed to tomorrow&#x27;s call.</p>
      <h2>The customer has a job of their own</h2>
      <p>Back to the made-up request. The customer who spoke at the event may be delighted to talk to a peer. She may also be preparing her own launch. You don&#x27;t know until you ask, and the deal deadline is not her deadline.</p>
      <p>It is easy to say, &quot;It&#x27;s only thirty minutes.&quot; For the customer, it may mean finding the right person, checking what can be discussed, getting internal approval and making time around their real work. It may also mean saying no to an awkward request from a vendor they otherwise like.</p>
      <p>This doesn&#x27;t mean CS should hide customers from Sales. It means the person making the request should do the preparation instead of passing that work to the customer.</p>
      <p>Send the buyer&#x27;s question in advance. Offer a time window rather than a demand for tomorrow. Make it clear that a decline won&#x27;t change the support the customer receives. If the customer wants to help but can&#x27;t do a call, ask whether a shorter or less public option would suit them. Don&#x27;t assume a quote is easier; sometimes the approval for public words is the hardest part.</p>
      <p><a href="https://handbook.gitlab.com/job-description-library/marketing/reference-program-manager/">GitLab&#x27;s reference-program role description</a> includes respect for the customer&#x27;s time and effort, and a positive result for the customer as well as the vendor. That&#x27;s a stated job responsibility, not proof that every reference programme lives up to it. But it is a decent standard for the conversation.</p>
      <p>What does the customer get from this? There might be a chance to share work they&#x27;re proud of, meet someone with the same problem, or build their own profile. Sometimes the honest answer is: not much, beyond helping a partner. Don&#x27;t dress that up as a benefit. Make a smaller ask.</p>
      <h2>Try the smaller ask first</h2>
      <p>There is a fair objection: this could become another slow process. If every reference request needs a meeting, a form and three approvals, the team will stop asking. Some customers enjoy helping. Prospects do need to speak to peers. A useful customer story can give the customer credit for work that otherwise stays invisible.</p>
      <p>So don&#x27;t build a committee. Put a short note in the opportunity you already use. It needs to answer three things.</p>
      <p>First, what is the buyer trying to learn? Write the question in the buyer&#x27;s words if you have them. If nobody can state it, don&#x27;t send a vague request to the customer yet.</p>
      <p>Second, what would the customer actually have to do? Name the format, the time, the audience and the deadline. Include any approval needed for a logo, quote or public story. Check whether other teams have approached the same person recently. You do not need a public list of individual advocates to do this; the account owner can check privately with the people involved.</p>
      <p>Third, is there a smaller way to answer the question? Maybe the buyer can read a story already approved for this use. Maybe a product or delivery lead can answer first, and the customer call is reserved for what only a peer can explain. Maybe the customer would rather send two written points than join a live meeting. Maybe this is simply the wrong week.</p>
      <p>Then make one decision: ask as planned, make a smaller ask, use existing proof, or wait. Give a reason. If you wait, say what would change the answer. &quot;Not now&quot; should not become a quiet veto with no next step.</p>
      <p>The <a href="/pdfs/Reference_Request_Note_ChurnIsDead.pdf">Reference Request Note</a> is one page for that conversation. It isn&#x27;t a new database or a score for how generous a customer has been.</p>
      <h2>How the made-up request could end</h2>
      <p>The account owner learns that the buyer wants to know what went wrong during rollout and how the customer handled it. That is a good peer question. The existing case study doesn&#x27;t answer it. A product demo won&#x27;t answer it either.</p>
      <p>The customer has already given time to the event and the story, so the account owner checks with CS before asking again. They send the question, explain the audience and ask whether a call next week would suit. They also offer the buyer an approved story for now.</p>
      <p>The customer can say yes, choose another time, suggest a colleague, or decline. There is no invented happy ending here. The point is that she gets a real choice, and the prospect gets a reference matched to the question rather than a name pulled from a list.</p>
      <p>If she says yes, prepare both sides. Tell the buyer which topics are fair game and which are not. Don&#x27;t script the customer to make the product look flawless. If the buyer needs to hear only praise, the team isn&#x27;t looking for a reference. It is looking for an ad.</p>
      <h2>Try this on the next request</h2>
      <p>Pick one live request this week. Before anyone contacts the customer, ask the account owner to write down the buyer&#x27;s question and the exact customer ask. Then choose the least demanding way to answer it. Use the existing opportunity notes; you do not need a new process for every deal.</p>
      <p>Afterward, check whether the customer was comfortable with what happened and whether the buyer&#x27;s question was actually answered. Don&#x27;t count the customer&#x27;s yes as the whole result.</p>
      <p>You won&#x27;t learn from one request whether this changes retention or win rates. You will learn whether your team knows the difference between a customer willing to help and a customer with time to spare.</p>
      <p><strong>The job is not to protect customers from every ask. It is to make the ask worth making.</strong></p>
      <h2>Sources and methodology</h2>
      <ul>
      <li><a href="https://handbook.gitlab.com/handbook/marketing/growth-marketing/growth-community-programs/">GitLab: Growth Community Programs</a>. A first-party example of distinct reference uses, written approval and checking prior advocate activity. Its deadlines and process are not general benchmarks.</li>
      <li><a href="https://handbook.gitlab.com/handbook/marketing/developer-relations/programs/operational-guidelines/">GitLab: DevRel Programs Operational Guidelines</a>. A first-party example of explicit, documented reference agreement for that programme, not legal guidance for all companies.</li>
      <li><a href="https://handbook.gitlab.com/job-description-library/marketing/reference-program-manager/">GitLab: Reference Program Manager</a>. A role description that names respect for customer time and reciprocal value, not evidence of measured impact.</li>
      </ul>
      <p>Accessed 6 October 2026. The opening and closing situations are illustrative, not customer stories or Kuber&#x27;s experience. The four-way decision and Reference Request Note are original editorial proposals. No causal claim about win rate, retention or churn is made.</p>
