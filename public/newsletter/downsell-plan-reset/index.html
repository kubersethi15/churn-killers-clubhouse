      <h1 style="font-family:Helvetica,Arial,sans-serif;font-size:32px">The Customer Bought Less. Rewrite the Plan.</h1>
      <p style="color:#999;font-size:13px">7 min read · Commercial Mechanics</p>
      <p># The Customer Bought Less. Rewrite the Plan.</p>
      <p>Imagine a customer renewing fewer licences after closing a department. This is a fictional example.</p>
      <p>The smaller order is agreed. The account stays. The renewal is marked closed.</p>
      <p>The next success meeting still opens the old plan: roll out to the whole company, train another department, build a reporting workflow. The people who were meant to do that work have left. Nobody has asked whether the remaining team still needs it.</p>
      <p>The commercial record has changed. The working plan hasn&#x27;t.</p>
      <p>I&#x27;d treat that gap as unfinished renewal work. A smaller contract deserves a fresh conversation about what the customer is trying to do, what they can support and what help is actually agreed. It doesn&#x27;t automatically justify cutting service, and it doesn&#x27;t prove the customer will leave next year.</p>
      <p>The useful decision is more specific: <strong>what plan can both sides carry out now?</strong></p>
      <h2>Start with the reason, not the smaller number</h2>
      <p>A reduction can describe very different situations. An unused department may have been removed. A project may have stopped. The customer may have fewer people to run the work. Or the product may have disappointed them.</p>
      <p>Those are possibilities to investigate, not explanations to fill in on the customer&#x27;s behalf.</p>
      <p>ChartMogul&#x27;s <a href="https://help.chartmogul.com/article/166-subscription-analytics-glossary">metrics glossary</a> distinguishes contraction, a reduction in recurring revenue, from the cancellation of all subscriptions. That is a useful measurement distinction. It isn&#x27;t an account diagnosis.</p>
      <p>GitLab&#x27;s <a href="https://handbook.gitlab.com/handbook/customer-experience/renewals-managers/how/">renewals guidance</a> also distinguishes a smaller renewal with an active customer from full churn. Neither classification tells a CSM which customer workflow still matters.</p>
      <p>Ask the person responsible for the remaining work what changed. Then check that explanation against the plan. If the customer says a department closed, which tasks disappeared with it? If the budget changed but the required result did not, where will the missing capacity come from?</p>
      <p>Don&#x27;t translate every answer into a win-back opportunity. Understand the smaller business relationship before trying to make it bigger again.</p>
      <h2>Put the old plan beside the new situation</h2>
      <p>I&#x27;d use a short plan reset with the customer owner and the vendor people who can make the relevant decisions. Add a commercial or technical owner only where their answer is needed. This is a proposed working practice, not a benchmark for how every account should be managed.</p>
      <p>Open the existing plan rather than asking the customer to explain everything again. Pick the work that is still active. For each item, ask three plain questions:</p>
      <ul>
      <li>Does the customer still need this result?</li>
      <li>Can the remaining team do its part?</li>
      <li>Is the vendor help required for it actually agreed?</li>
      </ul>
      <p>Keep the answers separate. A necessary workflow can be impossible with the current staffing. An optional project can be easy to deliver and still be the wrong use of everyone&#x27;s time.</p>
      <p>GitLab&#x27;s current <a href="https://handbook.gitlab.com/handbook/customer-experience/csm/success-plans/">success-plan guidance</a> describes work items with customer-recognisable success criteria and a responsible owner, refreshed as the work changes. That&#x27;s one company&#x27;s method. The transferable point is to make the current work visible; this proposal doesn&#x27;t require its tools or templates.</p>
      <p>The output should be a few changed decisions in the plan you already use. Another presentation explaining that the account has contracted won&#x27;t settle them.</p>
      <h2>Choose a plan that fits</h2>
      <p>For each important workflow, I&#x27;d make one of three calls.</p>
      <p><strong>Keep it.</strong> The result is still needed and both sides can provide the people, access and agreed help. Keep the work, but update the owner or date if those changed. A smaller licence count alone is not a reason to make the customer rebuild a working process.</p>
      <p><strong>Narrow it.</strong> A useful result remains possible with less scope. Name what will be delivered and what will be left out. “We&#x27;ll do what we can” leaves the customer guessing which part of the old promise survives.</p>
      <p><strong>Pause it.</strong> The required people, access or help are missing, or the result is no longer needed. Record what would need to change before the work restarts. Don&#x27;t keep an impossible milestone green because nobody wants to remove it.</p>
      <p>These are planning decisions. They don&#x27;t change a contract, waive an entitlement or let a CSM promise additional services. If the chosen plan needs a commercial change, get the authorised owner to resolve it. Until then, show that dependency as open.</p>
      <h2>Work through the smaller account</h2>
      <p>Return to the fictional customer whose department closed.</p>
      <p>Suppose the old plan covered a company-wide rollout and a weekly report used by the remaining operations team. The rollout no longer has a sponsor. The report still matters, but the person who maintained its mapping has left.</p>
      <p>Closing the rollout item may be sensible. Closing the report item because the customer bought fewer licences would miss the continuing need.</p>
      <p>A narrower proposal could keep the report for one region while the customer names a new operator and checks the mapping. Another proposal could retain the existing scope if the remaining team confirms it has capacity. If nobody can maintain the mapping, the plan needs a temporary arrangement or an explicit pause, not a reassuring status update.</p>
      <p>No outcome is claimed for this example. It shows why the same commercial reduction can require different decisions for different pieces of work.</p>
      <p>Before leaving the conversation, the customer should be able to explain the revised plan without interpreting the vendor&#x27;s internal account tier. They need to know what will happen, who is doing it and which unanswered decision could stop it.</p>
      <h2>Don&#x27;t quietly turn less revenue into less help</h2>
      <p>There is a legitimate internal question about the effort a smaller account can receive. Answer it openly with the people responsible for coverage and commercial commitments.</p>
      <p>A CSM should not discover an unofficial service reduction by being told to cancel meetings after the new order is signed. Equally, keeping every old activity without checking its purpose can hide work that neither side needs.</p>
      <p>Separate three things: what the agreement requires, what the customer needs to achieve the remaining goal and what extra help someone is proposing. If those don&#x27;t line up, name the gap and the decision-maker.</p>
      <p>Some accounts will fit a different engagement model. Some will need a short, approved transition. Others will keep the same help because the work and entitlement haven&#x27;t changed. This worksheet doesn&#x27;t choose the model for you.</p>
      <p>It makes the consequences visible before anyone promises a result the new plan cannot support.</p>
      <h2>Change the progress check too</h2>
      <p>The old target may no longer describe success. If the customer has stopped a rollout, continuing to report progress against the original population can make a sensible reduction look like failed adoption. Quietly replacing the denominator without recording why can also conceal a problem.</p>
      <p>Keep the previous target as history. Record the revised population, expected result and reason for changing the measure. Use the customer&#x27;s actual remaining work as the test.</p>
      <p>I&#x27;d review the revised plan after the next meaningful use of the workflow, rather than choosing a universal number of days. What did the customer complete? What still required unexpected help? Did the promised result reach the person who needed it?</p>
      <p>If the narrowed plan still doesn&#x27;t work, revisit the decision. Don&#x27;t wait for a renewal forecast to reveal that both sides have been working from different assumptions.</p>
      <h2>Use the Downsell Plan Reset</h2>
      <p><a href="https://churnisdead.com/pdfs/Downsell_Plan_Reset_ChurnIsDead.pdf">Download the one-page Downsell Plan Reset</a>.</p>
      <p>The one-page worksheet puts the changed situation, the working decision and the next check together. Use it with one account whose order has reduced while its success plan still describes the old relationship.</p>
      <p>Bring the current plan, the confirmed reason for the reduction and the relevant service commitments. Where something is unknown, write the question and name who will answer it. Don&#x27;t guess an entitlement, customer priority or staffing commitment to complete a box.</p>
      <p>Leave with the plan amended, the customer owner clear and any commercial dependency visible. Share the changed decisions through the account&#x27;s normal agreed channel. You don&#x27;t need a new meeting series.</p>
      <p><strong>This week, choose one smaller renewal and check what changed in its working plan.</strong> If the answer is only the contract value, the operational part of the renewal is still open.</p>
      <h2>Sources and methodology</h2>
      <p><a href="https://help.chartmogul.com/article/166-subscription-analytics-glossary">ChartMogul&#x27;s metrics glossary</a> supports the narrow distinction between contraction and full subscription cancellation. <a href="https://handbook.gitlab.com/handbook/customer-experience/renewals-managers/how/">GitLab&#x27;s renewals guidance</a> supplies a first-party example of treating an active downsell separately from full churn. <a href="https://handbook.gitlab.com/handbook/customer-experience/csm/success-plans/">GitLab&#x27;s success-plan guidance</a> describes current work, success criteria and responsible owners being maintained together.</p>
      <p>These are product definitions and one company&#x27;s operating guidance, not evidence that this worksheet improves retention. The plan reset, decision choices and worksheet are original editorial proposals. The opening and worked account are explicitly fictional. No customer result, universal service ratio or legal interpretation is asserted.</p>
