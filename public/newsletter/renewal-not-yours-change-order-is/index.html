    <div style="max-width:680px;margin:40px auto;padding:0 16px;font-family:Georgia,serif;line-height:1.7;color:#1a1a1a">
      <p style="font-size:11px;letter-spacing:3px;color:#C8553D;font-weight:bold;text-transform:uppercase">CHURN IS DEAD</p>
      <h1 style="font-family:Helvetica,Arial,sans-serif;font-size:32px">The Renewal Is Not Yours to Own. The Change Order Is.</h1>
      <p style="color:#999;font-size:13px">11 min read · Strategy</p>
      <p>Thirty-one.</p>
      <p>That&#x27;s how many out-of-contract requests one enterprise CSM I know absorbed across eleven accounts in a single quarter. She counted them for me on a call, off a note she&#x27;d started keeping in Apple Notes because her manager kept asking why she looked exhausted going into renewals.</p>
      <p>The custom Salesforce dashboard a VP of Ops wanted before a board meeting. The ad-hoc training session for a team that never showed up to the paid one. The integration triage when a customer&#x27;s own engineer broke the webhook. The exec-briefing deck she built from a blank slide at 9pm because the sponsor had a QBR with *his* board the next morning and asked, nicely, if she could &quot;just pull something together.&quot;</p>
      <p>Every one of those was called &quot;the relationship.&quot;</p>
      <p>In professional services, every one of those is a priced change order. A documented variation to the statement of work. A line item someone signs.</p>
      <p>CS took the &quot;do whatever it takes&quot; ethos from professional services and imported it wholesale. And left behind the only discipline that ever made that ethos survivable.</p>
      <hr>
      <h2>The 60-Second Version</h2>
      <p><strong>The hard truth:</strong> The unpriced favors that make an account love you are the same favors that make your role economically indefensible and trivially outsourceable.</p>
      <p><strong>The framework:</strong> The Scope Line separates what the renewal actually pays for from the favor load you silently absorb, and routes every out-of-contract request to product, to priced services, or to a documented no.</p>
      <p><strong>This week:</strong> Start a favor ledger. Log every request that falls outside the contract for one quarter and total the hours per account. You cannot manage what you have never once counted.</p>
      <hr>
      <h2>The renewal was never the thing you owned</h2>
      <p>Here is the fantasy the whole category is built on: that the CSM owns the renewal.</p>
      <p>You don&#x27;t. You never did. The renewal is a procurement event decided by whether your exec champion still has budget and still has a job. It is settled in a finance review you are not invited to, against a pricing model you did not set, in a quarter shaped by a reorg no health score predicted.</p>
      <p>I have watched green-scored accounts crater on a sponsor change and red-flagged ones save themselves because a new champion inherited a bigger budget. The renewal outcome lives in a political weather system the CSM influences at the margins.</p>
      <p>So when Gainsight repositioned itself at Pulse this year as a retention-as-a-service business, telling the market that technology &quot;is expected to deliver the outcome itself&quot; and that it will &quot;own the outcome, managing renewal motions end-to-end,&quot; boards leaned in. Not because Gainsight discovered something. Because CS never made its human labor legible, so the board had no way to tell the difference between a renewal a machine can run and one it can&#x27;t.</p>
      <p>The renewal is not yours to own. But the change order is. And you gave it away for free.</p>
      <hr>
      <h2>The broken state: unpriced generosity as a business model</h2>
      <p>Walk into most enterprise CS teams and you will find a workforce that is genuinely, admirably generous. They stay late. They build the deck. They absorb the integration mess. They wear it as a badge.</p>
      <p>And not one of them can tell you what a single favor cost.</p>
      <p>That&#x27;s the difference between CS and the professional services orgs it borrowed its ethos from. In PS, uncontrolled scope has a name. It&#x27;s called scope creep, and it is treated as a margin-destroying failure mode, not a virtue. A delivery lead who let thirty-one unpriced variations onto a project would be in a very uncomfortable meeting. In CS, that same behaviour gets you a shout-out in the team channel.</p>
      <p>Benchmarkit&#x27;s SaaS metrics work has put fully loaded CS cost-to-serve in the range of 10 to 15 percent of the revenue those teams support, and that figure only counts the work the org can see. The favor load is the part that never touches a system. It doesn&#x27;t show up in the CRM, in the capacity model, or in cost-to-serve. It shows up as burnout, and eventually as a resignation.</p>
      <p>Which is not a hypothetical right now. Forty-four percent of CS professionals have been at their current company two years or less, up from eighteen percent a year prior. Experienced people who know exactly what good looks like are walking out mid-reorg. And when they go, the favor load doesn&#x27;t disappear. It gets inherited, uncounted, by the next person, who also doesn&#x27;t measure it, until the account has been trained across three CSMs to believe that everything is free and nothing has a price.</p>
      <p>Here&#x27;s what that training does to your economics.</p>
      <p>Every unpriced favor teaches the account two things at once. It teaches the customer that value has no cost. And it teaches your board that the value could have been produced by something cheaper than a senior human. You didn&#x27;t build loyalty. You built a dependency that looks exactly like something a machine could run at a fraction of the price.</p>
      <p>That is the trap. The most beloved CSMs are often the ones who have made themselves the easiest to replace, because they turned judgment work into a free utility, and utilities get automated.</p>
      <hr>
      <h2>What the real ledger showed</h2>
      <p>Back to the CSM with thirty-one favors.</p>
      <p>Here is the honest part the LinkedIn version of this story would skip: after she wrote them down, she didn&#x27;t march into her boss&#x27;s office and reform the org. She showed me the note, we talked, and then the quarter kept moving. Nothing changed for a while, because there was no mechanism for anything to change. That&#x27;s the actual problem. It isn&#x27;t that CSMs love scope creep. It&#x27;s that when a request lands, the only available action is to absorb it. There is no &quot;route this&quot; button. There is no change order to raise. Saying no feels like abandoning the customer, and saying yes is free to say and expensive to do.</p>
      <p>When we finally tagged the thirty-one requests, the shape of the problem became visible for the first time.</p>
      <p>About a third of them were product gaps. Things the platform should have done and didn&#x27;t, so the human papered over the hole. Those weren&#x27;t favors. They were unlogged bug reports and feature requests wearing a trench coat, and every hour spent on them was an hour product never learned it needed to fund.</p>
      <p>Another chunk were genuine services work. Custom dashboards, bespoke training, integration builds. In a company with a productized services SKU, every one of those is billable. That model exists and it isn&#x27;t exotic. Plenty of vendors now sell paid onboarding packages and CSM-as-a-service tiers precisely because they figured out that expert human time is a product, not a courtesy. CS teams that give it away are competing against their own company&#x27;s price list and losing on purpose.</p>
      <p>A smaller set were things that should have been a polite, documented no.</p>
      <p>And a genuinely small handful were the real thing. The favors worth keeping.</p>
      <p>The point of counting was never to eliminate generosity. It was to find out how much of it was actually generosity and how much was just an org quietly running professional services for free through people it pays to manage renewals.</p>
      <hr>
      <h2>The Scope Line</h2>
      <p>The fix is not more ownership. It&#x27;s a line. Here is <strong>The Scope Line</strong>, and how each part actually runs.</p>
      <h3>1. In-contract: name what the renewal pays for</h3>
      <p>Most CSMs cannot articulate, in one sentence, what the contract actually entitles the customer to. Neither can the customer. That ambiguity is where every favor is born, because when nobody has stated the edge, everything feels included.</p>
      <p>Write it down. The specific entitlements. The response commitments. The number of reviews, the scope of support, what &quot;onboarding&quot; concretely covers and where it stops. Say it out loud in the kickoff, not defensively, just clearly. Both sides should be able to point at the same edge.</p>
      <p>A line everyone agrees on is not a cold line. It&#x27;s a fair one. The coldness comes from surprises, and surprises only exist where the edge was never drawn.</p>
      <h3>2. The favor ledger: count for one quarter</h3>
      <p>You cannot manage what you have never counted. For one quarter, log every request that falls outside that in-contract line. Not the big obvious ones. All of them.</p>
      <p>Make the ledger something a VP can screenshot and hand to the team on Monday. Real columns, real tags:</p>
      <p>1. <strong>Date</strong> and <strong>account</strong></p>
      <p>2. <strong>The request</strong> in one plain line</p>
      <p>3. <strong>Hours</strong> it actually took, including the context-switching tax</p>
      <p>4. <strong>Tag:</strong> `product-gap` / `priced-services` / `relationship-investment` / `should-be-a-no`</p>
      <p>An example row from that real ledger: *Mar 4 | [Enterprise Ops account] | Built custom exec dashboard for board meeting | 6 hrs | priced-services.*</p>
      <p>Six hours. Not on any invoice. Now multiply that across a book and a quarter and you have the number your cost-to-serve model has been hiding. That total, the sum of the `priced-services` and `product-gap` hours, is your <strong>favor load</strong>: the hours of unscoped, unpriced work a CSM absorbs per account per quarter. It is the single most useful number CS leadership does not currently track.</p>
      <h3>3. Route, don&#x27;t absorb</h3>
      <p>The entire game is here. Every favor gets routed, never silently eaten.</p>
      <ul>
      <li>`product-gap` goes to product, logged, with the customer&#x27;s name attached, so the roadmap finally sees the cost of the hole its own users are being made to plug by hand.</li>
      <li>`priced-services` goes to your services team or a scoped statement of work. This is the change order CS forgot how to raise. It doesn&#x27;t have to be adversarial. &quot;That&#x27;s a great project, and it&#x27;s exactly the kind of thing our services team scopes. Let me get you the right person.&quot; That sentence protects margin and treats the request as serious rather than as a chore squeezed between check-ins.</li>
      <li>`should-be-a-no` becomes a documented, gracious no. Not a fight. A boundary, stated once, held consistently.</li>
      <li>`relationship-investment` is the only bucket the CSM keeps. See below.</li>
      </ul>
      <p>The routing is the mechanism the CSM with thirty-one favors never had. Give someone a place to send the request and they stop being a landfill for scope.</p>
      <h3>4. The relationship line: the favors worth keeping</h3>
      <p>This is the part every scope-discipline conversation gets wrong by omission, so let&#x27;s not.</p>
      <p>Drawing a line does not mean becoming transactional. It means being deliberate about the small set of unpriced moves you keep on purpose, because they build something an agent structurally cannot.</p>
      <p>An AI agent can send the reminder, generate the report, deflect the ticket, run the health check. What it cannot do is walk into a boardroom and rebuild a coalition after your champion gets promoted out. It cannot read the room in a tense renewal and know that the CFO&#x27;s real objection is political, not financial. It cannot give a new sponsor, three weeks into inheriting your account, the honest heads-up before a hard product change so that person looks smart in front of their own boss instead of blindsided.</p>
      <p>Those are the relationship-investment favors. The private warning before bad news. The introduction that makes your champion look good internally. The five minutes of candid advice that isn&#x27;t about your product at all. They are unpriced on purpose, and they are worth every unbilled minute, because they build the human coalition that decides renewals in exactly the political weather no dashboard tracks.</p>
      <p>The discipline is not to stop giving. It&#x27;s to stop giving away the services and the product gaps for free, so you have room left to give the coalition-building that only a human can.</p>
      <hr>
      <h2>The fixed state is not a nicer CSM. It&#x27;s a legible one.</h2>
      <p>The difference the Scope Line makes isn&#x27;t that your CSMs work less, though they might. It&#x27;s that the work becomes visible.</p>
      <p>When product sees the true volume of gap-patching, the roadmap gets a business case it never had. When services sees the priced-candidate hours, that&#x27;s a revenue line and a hiring case. When the CFO sees the favor load quantified, the conversation about cost-to-serve stops being a vibe and becomes a number with buckets, and each bucket has an owner who is not the exhausted human eating all of it.</p>
      <p>And when the board hears a vendor offer to &quot;own the outcome&quot; of your renewals, you can finally answer the question that has been sitting unanswered under this whole debate. Which accounts are outcome-ownable by an agent, and which need a human who can walk into a boardroom. You can answer it because you have data, not because you have loyalty.</p>
      <p>Professional services firms figured this out decades ago, and they didn&#x27;t do it because they were cold. They did it because they intended to still be in business next quarter.</p>
      <p>CS is at the same fork now. The generosity is real and it matters. But generosity without a change order isn&#x27;t a relationship strategy. It&#x27;s an unfunded liability with a smiling face, and boards have started noticing that it looks a lot like something they could buy cheaper.</p>
      <p>Count your favor load this quarter. Route what isn&#x27;t yours to carry. Keep the handful that a machine will never be able to fake.</p>
      <p>The renewal was never yours to own. But the line, the one that decides whether a human was necessary at all, still is. For now.</p>
