  <script type="application/json" id="ci-newsletter">{"id": "static-renewal-evidence-packet", "title": "Your Renewal Forecast Needs Receipts", "slug": "renewal-evidence-packet", "excerpt": "Replace renewal confidence percentages with an auditable packet that shows what the customer has decided, what remains uncertain, and what must happen next.", "content": "A renewal forecast can look precise and still be impossible to defend.\n\nThe account is 80 percent likely to renew. The CSM is confident. The health score is green. The renewal date is correct.\n\nThen somebody asks a more useful question: what has the customer actually done or said that makes this forecast credible?\n\nThe room starts searching through call notes.\n\nConfidence is not evidence. A percentage does not tell you whether the economic buyer supports the renewal, procurement has a path, the customer can explain the value, or a known risk has an owner. It compresses different kinds of uncertainty into one number and hides the reasoning that produced it.\n\nCustomer Success needs a forecast that can survive inspection.\n\nCall it the **Renewal Evidence Packet**: a compact record of the current evidence, the contradictions, and the next customer decision. It does not promise perfect prediction. It makes the forecast explainable, reviewable, and easier to change when the facts change.\n\n## Forecast states are useful. They are not proof\n\nForecast categories create a shared language. Salesforce, for example, uses standard categories including Pipeline, Best Case, Commit, Omitted, and Closed. Its official guidance explains that opportunity stages can map to those categories and that users may override the default category.\n\nThat structure is operationally useful. It lets a team aggregate a book of business and discuss different levels of confidence.\n\nBut a category is still a classification. It does not, by itself, show why a renewal belongs there.\n\nGitLab's public renewals handbook shows what a mo r has acknowledged it.\n\nUsage can support the case, but usage is not automatically value. A value claim becomes stronger when it connects product behaviour to an outcome the customer recognises. Keep the evidence specific: an approved success-plan outcome, a customer-confirmed operational change, or a business review record that the customer accepted.\n\nIf the value case exists only in your internal deck, classify it as an internal hypothesis.\n\n### 4. Decision path\n\nRecord the remaining steps between today and the commercial decision.\n\nThat might include a value review, security approval, budget submission, quote, procurement review, legal review, signature, or purchase order. Give each step an owner and expected date. Mark whether the date came from the customer, your team, or an assumption.\n\nThis turns “renewal in progress” into a sequence that can be tested.\n\n### 5. Risk and response\n\nDescribe the risk as a specific uncertain event, not a mood.\n\n“Low engagement” is an observation. “The new sponsor may remove the product from next quarter's budget because the original use case has no executive owner” is a decision risk.\n\nFor each material risk, record its source, potential effect, response, owner, and next evidence date. GitLab's public health guidance illustrates the need for this separation: it treats lack of information, loss of a sponsor, poor adoption, and known retention threats as different conditions, and asks account owners to log progress and next steps more frequently for at-risk customers.\n\n### 6. Contrary evidence\n\nGive the forecast a place for facts that weaken it.\n\nCompetitive evaluation, seat reductions, a silent budget owner, unresolved support history, a delayed security review, or an unconfirmed success metric should not disappear because the overall sentiment is green.\n\nThe strongest packet is not the one with the most positive evidence. It is the one that makes disagreement visible.\n\n## Evidence needs a quality label\n\nNot all evidence deserves the same weight. Give each item one of four labels:\n\n- **Customer-confirmed:** stated or approved by someone with relevant decision authority.\n- **Observed:** behaviour or system data directly recorded by your organisation.\n- **Internally asserted:** a judgement from the account team that the customer has not confirmed.\n- **Missing:** required information that has not been obtained.\n\nThen add a source date and an expiry date.\n\nExpiry is deliberately contextual. A procurement path may remain stable for months. An executive's intent can change after a reorganisation. Product usage may need a shorter review cycle. Set the interval your business can defend, then make stale evidence visible.\n\nThis borrows a principle from assurance, not a rule from government. HM Treasury's Orange Book defines assurance as confidence derived from objective information about activities, controls, compliance, and the credibility of information used for decisions. It also warns that confidence falls when the integrity of the information or underlying process is uncertain.\n\nA renewal forecast deserves the same discipline: confidence should rise because the evidence is current and inspectable, not because the field is green.\n\n## Replace percentages with promotion rules\n\nKeep your CRM categories if the wider business relies on them. Change the rule for entering each state.\n\nHere is a starting model:\n\n- **Unverified:** the basic contract facts exist, but customer authority, value, or decision path is missing.\n- **Evidence building:** the decision roles and value case are being tested; material unknowns remain.\n- **Credible path:** the customer has confirmed the decision path and value case, with no unresolved contradiction that could materially change scope or timing.\n- **Commit:** the authorised commercial path is active, required approvals are understood, and remaining steps have owners and dates.\n- **Closed:** the commercial outcome is       <p style="font-size:11px;letter-spacing:3px;color:#C8553D;font-weight:bold;text-transform:uppercase">CHURN IS DEAD</p>
      <h1 style="font-family:Helvetica,Arial,sans-serif;font-size:32px">Your Renewal Forecast Needs Receipts</h1>
      <p style="color:#999;font-size:13px">8 min read · Commercial</p>
      <p>A renewal forecast can look precise and still be impossible to defend.</p>
      <p>The account is 80 percent likely to renew. The CSM is confident. The health score is green. The renewal date is correct.</p>
      <p>Then somebody asks a more useful question: what has the customer actually done or said that makes this forecast credible?</p>
      <p>The room starts searching through call notes.</p>
      <p>Confidence is not evidence. A percentage does not tell you whether the economic buyer supports the renewal, procurement has a path, the customer can explain the value, or a known risk has an owner. It compresses different kinds of uncertainty into one number and hides the reasoning that produced it.</p>
      <p>Customer Success needs a forecast that can survive inspection.</p>
      <p>Call it the <strong>Renewal Evidence Packet</strong>: a compact record of the current evidence, the contradictions, and the next customer decision. It does not promise perfect prediction. It makes the forecast explainable, reviewable, and easier to change when the facts change.</p>
      <h2>Forecast states are useful. They are not proof</h2>
      <p>Forecast categories create a shared language. Salesforce, for example, uses standard categories including Pipeline, Best Case, Commit, Omitted, and Closed. Its official guidance explains that opportunity stages can map to those categories and that users may override the default category.</p>
      <p>That structure is operationally useful. It lets a team aggregate a book of business and discuss different levels of confidence.</p>
      <p>But a category is still a classification. It does not, by itself, show why a renewal belongs there.</p>
      <p>GitLab&#x27;s public renewals handbook shows what a more detailed operating record can contain. Its renewal fields include next steps, notes, risk category, forecast health, available-to-renew revenue, forecast amount, active mitigation, and best-case, most-likely, and commit scenarios. Its process also distinguishes actionable churn or contraction risk from outcomes believed to be certain.</p>
      <p>This is not a universal template. It is evidence that a real renewal operation needs more than a colour or percentage. Forecast, risk, intervention, ownership, and next action are separate pieces of information.</p>
      <p>The Renewal Evidence Packet brings those pieces into one reviewable record.</p>
      <h2>The six evidence domains</h2>
      <p>This framework is a Churn Is Dead proposal, not an industry benchmark. Adapt the fields to your segment, contract model, and sales process.</p>
      <p>A forecast is review-ready when the packet addresses six domains.</p>
      <h3>1. Contract reality</h3>
      <p>Record the renewal date, notice period, available-to-renew scope, current commercial configuration, and any known procurement or legal steps.</p>
      <p>Do not confuse a correct date in the CRM with a confirmed buying process. A contract may auto-renew while the customer intends to reduce scope. A commercial conversation may be positive while a notice deadline is approaching. The packet should show both the contractual mechanism and the expected customer action.</p>
      <h3>2. Customer authority</h3>
      <p>Name the people involved in the decision and the evidence of their roles.</p>
      <p>Who owns the budget? Who can approve the renewal? Who can block it? Who will operate the product after renewal? A friendly champion is valuable, but enthusiasm from one contact is not the same as authority across the decision.</p>
      <p>Record the most recent direct interaction with each critical role. If the economic buyer has not engaged, write <strong>unverified</strong>. Do not convert absence into optimism.</p>
      <h3>3. Value proof</h3>
      <p>State the outcome the customer expected, the evidence that the outcome occurred, and whether the customer has acknowledged it.</p>
      <p>Usage can support the case, but usage is not automatically value. A value claim becomes stronger when it connects product behaviour to an outcome the customer recognises. Keep the evidence specific: an approved success-plan outcome, a customer-confirmed operational change, or a business review record that the customer accepted.</p>
      <p>If the value case exists only in your internal deck, classify it as an internal hypothesis.</p>
      <h3>4. Decision path</h3>
      <p>Record the remaining steps between today and the commercial decision.</p>
      <p>That might include a value review, security approval, budget submission, quote, procurement review, legal review, signature, or purchase order. Give each step an owner and expected date. Mark whether the date came from the customer, your team, or an assumption.</p>
      <p>This turns “renewal in progress” into a sequence that can be tested.</p>
      <h3>5. Risk and response</h3>
      <p>Describe the risk as a specific uncertain event, not a mood.</p>
      <p>“Low engagement” is an observation. “The new sponsor may remove the product from next quarter&#x27;s budget because the original use case has no executive owner” is a decision risk.</p>
      <p>For each material risk, record its source, potential effect, response, owner, and next evidence date. GitLab&#x27;s public health guidance illustrates the need for this separation: it treats lack of information, loss of a sponsor, poor adoption, and known retention threats as different conditions, and asks account owners to log progress and next steps more frequently for at-risk customers.</p>
      <h3>6. Contrary evidence</h3>
      <p>Give the forecast a place for facts that weaken it.</p>
      <p>Competitive evaluation, seat reductions, a silent budget owner, unresolved support history, a delayed security review, or an unconfirmed success metric should not disappear because the overall sentiment is green.</p>
      <p>The strongest packet is not the one with the most positive evidence. It is the one that makes disagreement visible.</p>
      <h2>Evidence needs a quality label</h2>
      <p>Not all evidence deserves the same weight. Give each item one of four labels:</p>
      <ul>
      <li><strong>Customer-confirmed:</strong> stated or approved by someone with relevant decision authority.</li>
      <li><strong>Observed:</strong> behaviour or system data directly recorded by your organisation.</li>
      <li><strong>Internally asserted:</strong> a judgement from the account team that the customer has not confirmed.</li>
      <li><strong>Missing:</strong> required information that has not been obtained.</li>
      </ul>
      <p>Then add a source date and an expiry date.</p>
      <p>Expiry is deliberately contextual. A procurement path may remain stable for months. An executive&#x27;s intent can change after a reorganisation. Product usage may need a shorter review cycle. Set the interval your business can defend, then make stale evidence visible.</p>
      <p>This borrows a principle from assurance, not a rule from government. HM Treasury&#x27;s Orange Book defines assurance as confidence derived from objective information about activities, controls, compliance, and the credibility of information used for decisions. It also warns that confidence falls when the integrity of the information or underlying process is uncertain.</p>
      <p>A renewal forecast deserves the same discipline: confidence should rise because the evidence is current and inspectable, not because the field is green.</p>
      <h2>Replace percentages with promotion rules</h2>
      <p>Keep your CRM categories if the wider business relies on them. Change the rule for entering each state.</p>
      <p>Here is a starting model:</p>
      <ul>
      <li><strong>Unverified:</strong> the basic contract facts exist, but customer authority, value, or decision path is missing.</li>
      <li><strong>Evidence building:</strong> the decision roles and value case are being tested; material unknowns remain.</li>
      <li><strong>Credible path:</strong> the customer has confirmed the decision path and value case, with no unresolved contradiction that could materially change scope or timing.</li>
      <li><strong>Commit:</strong> the authorised commercial path is active, required approvals are understood, and remaining steps have owners and dates.</li>
      <li><strong>Closed:</strong> the commercial outcome is recorded.</li>
      </ul>
      <p>These are proposals, not benchmark definitions. Tighten them for your business. The important move is to require evidence for promotion and to demote the forecast when evidence expires or a contradiction appears.</p>
      <p>An account does not earn Commit because the CSM feels better this week. It earns Commit because the packet can show what changed.</p>
      <h2>Run the review as an audit, not a performance</h2>
      <p>Choose a small set of upcoming or high-impact renewals. The owner presents only three things:</p>
      <p>1. the current forecast state;</p>
      <p>2. the newest confirming or contrary evidence;</p>
      <p>3. the next decision or evidence required.</p>
      <p>Reviewers do not ask for a longer narrative. They test the packet:</p>
      <ul>
      <li>Which item proves the customer has authority and intent?</li>
      <li>What evidence could overturn this forecast?</li>
      <li>Which item is stale?</li>
      <li>Is the next step owned by the customer or only by us?</li>
      <li>What must become true before this account is promoted?</li>
      </ul>
      <p>End with one recorded outcome: retain the state, promote it, demote it, or mark it unverified. Record the reason and the next review date.</p>
      <p>The review is working when two people can inspect the same packet and understand why the account sits in its current state, even if they disagree with the judgement.</p>
      <h2>Start with one account</h2>
      <p>Do not rebuild the CRM first.</p>
      <p>Take one renewal currently labelled Commit. Build the six-domain packet using the evidence you already have. Mark every item customer-confirmed, observed, internally asserted, or missing. Add contrary evidence. Expire anything too old to guide the next decision.</p>
      <p>Then ask whether the account still belongs in Commit.</p>
      <p>The purpose is not to make the forecast pessimistic. It is to make it credible.</p>
      <p><a href="/pdfs/Renewal_Evidence_Packet_ChurnIsDead.pdf">Download the Renewal Evidence Packet</a></p>
      <h2>Sources and methodology</h2>
      <p>This issue proposes a Churn Is Dead operating model. It does not claim that the six domains, evidence labels, state definitions, or expiry intervals are universal benchmarks. The model draws on the category structure in <a href="https://help.salesforce.com/s/articleView?id=sf.forecasts3_customizing_forecasts_categories.htm&amp;language=en_US&amp;type=5">Salesforce&#x27;s official forecasting guidance</a>, the separation of forecast, risk, mitigation, ownership, and next steps in <a href="https://handbook.gitlab.com/handbook/customer-success/renewals-managers/what/">GitLab&#x27;s public renewals methodology</a>, the treatment and review of uncertainty in <a href="https://handbook.gitlab.com/handbook/customer-success/csm/health-score-triage/">GitLab&#x27;s customer health guidance</a>, and the relationship between objective information and decision confidence in <a href="https://www.gov.uk/government/publications/orange-book/the-orange-book-management-of-risk-principles-and-concepts">HM Treasury&#x27;s Orange Book</a>. Sources were reviewed on 24 August 2026.</p>
