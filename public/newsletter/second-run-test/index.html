      <p style="font-size:11px;letter-spacing:3px;color:#C8553D;font-weight:bold;text-transform:uppercase">CHURN IS DEAD</p>
      <h1 style="font-family:Helvetica,Arial,sans-serif;font-size:32px">It Worked Once. Can the Customer Run It Again?</h1>
      <p style="color:#999;font-size:13px">7 min read · Customer Leadership</p>
      <p>Picture a fictional onboarding handoff. The vendor sets up the permissions, fixes the input file and sits on the call while the customer clicks Run. Everybody sees the right output.</p>
      <p>The following week, the person who usually does the work runs a fresh export. A new case comes through with the urgency field blank. The lead on the next shift can’t tell what to pick up first.</p>
      <p>Put that decision on the onboarding agenda. How much did the first run tell you about what the customer can do next week?</p>
      <p>A first run can show that the product works for this task under the conditions you gave it. Before you take scheduled help out of the plan, run it again under the conditions the customer will have when you leave. Put the second run on the calendar while you still have both teams in the room.</p>
      <h2>Decide what the customer is taking over</h2>
      <p>Pick one job with a real input and a result somebody needs. “The team can use reporting” leaves too much room for interpretation. “The support lead can pull Friday’s open escalations and hand a usable list to the weekend lead before the shift changes” gives both sides something to watch.</p>
      <p>Ask the person who usually does the job to describe it. Where does the input come from? What makes the output good enough to send? What happens on a bad day? Put the answers where they keep the work today. If that’s a shared checklist, add a line to the checklist. The handoff shouldn’t depend on the vendor’s meeting notes being open in another tab.</p>
      <p>There’s a difference between the person who said yes to the project and the person who has to do the work at four on a Friday. The former can give the project time and backing. The latter can tell you that the list needs a column nobody mentioned in the demo. You may need both, but let the second person define what a useful run looks like.</p>
      <p>Write down who is expected to run the task, who uses the result, and what vendor help remains part of the agreement. For a managed service, the vendor may still do much of the work. In that case, the customer’s second run might mean submitting a usable request and acting on the result through the agreed support route. Test the arrangement you sold.</p>
      <h2>Recreate a normal day</h2>
      <p>Use a new input when the work next comes up. Keep the normal account permissions, instructions and support route. Choose a case with the kind of variation the operator actually sees. A report with one new status can teach you more about the handoff than a second pass through last week’s polished file.</p>
      <p>Tell the customer what you’re checking and agree how you’ll help if they get stuck. A vendor engineer can observe with permission. Keep a short record of what the customer did, where they paused and who intervened. If the operator asks a question through the permanent support route and gets what they need in time, that’s part of a working arrangement. If an implementation specialist quietly changes a setting to save the meeting, record the intervention. You’ll need to know whether that same help is available on an ordinary day.</p>
      <p>Keep the stakes appropriate. If an error could create a serious problem, use a safe copy of the workflow with realistic permissions and inputs, or keep the required reviewer in place. Write down which conditions you simulated. A rehearsal can tell you where the operator needs help. It leaves the live handoff decision open until any production-only requirements are met.</p>
      <p>One detail makes this easier to run. Agree the failure point before the test. If the output needs approval before it reaches the next team, a successful export on its own is an incomplete run. Ask the recipient to check whether they can use the result. You want a finish line that means something to the person who has to pick the work up next.</p>
      <h2>Make the decision while the evidence is in front of you</h2>
      <p><strong>Hand over the agreed step.</strong> The intended operator completed it, the recipient could use the result, and any help came through a route the customer can use again. Leave the next run date, an owner, and a way to get help. Keep any support or obligations already in the agreement.</p>
      <p><strong>Hand over part of it.</strong> The customer can do most of the task and one step still needs named help. Be precise about that step. If the customer can compile the report and a vendor analyst still has to reconcile an exception, record who will handle the exception and how long that arrangement lasts. Give the customer an explicit path to run the next one with the same support.</p>
      <p><strong>Keep scheduled help in place.</strong> The operator couldn’t finish, the result couldn’t be used, or the intervention came from somebody who won’t normally be available. Write the blocker as something a named person can fix. “Needs more training” is a poor task. “Give the shift lead access to the queue and confirm they can see Friday’s open items” is something you can check. Agree the next realistic occasion to repeat the affected step.</p>
      <p>Be careful with the status you put into a weekly report. “Onboarding complete” can bury this distinction for the person who inherits the account. “Customer runs the weekly report. Vendor reconciles exceptions through December” carries the information they actually need. Capture the status at the level of the work. A stuck report shouldn’t erase a successful training session or stop a separate team from taking over a workflow it can already run.</p>
      <h2>What the second run would change on Friday</h2>
      <p>Take the fictional escalations report. The support lead runs a new export. They can open the report and add the weekend owner for every row except one. The new case type comes through with an empty urgency field. The weekend lead says they can’t decide what to pick up first without that field.</p>
      <p>The vendor engineer knows the missing mapping and could fix it during the call. Make that fix if it’s appropriate, then write it down as vendor intervention. Agree who owns future mappings and where the shift lead should ask when a new case type appears. Leave the report under scheduled help until the support lead can handle that exception through the route they’ll actually have. Keep the test focused on the missing mapping. There’s no reason to repeat every onboarding activity.</p>
      <p>The other possible outcome is just as useful. The support lead raises the mapping issue through the agreed support channel, gets a response before the shift changes, and hands over a list the weekend lead can use. Now you’ve seen the workflow and the support route work together. Record what happened and hand over that step.</p>
      <h2>Put one second run on the calendar</h2>
      <p>Open one account plan where a product task recently went live or is about to. Pick the next real occasion when the customer has to do that task. Ask the operator and the person who uses the result whether the time and finish line make sense. Use the <a href="/pdfs/Second_Run_Check_ChurnIsDead.pdf">Second Run Check</a> to record what happened and who owns what afterward.</p>
      <p>Two runs won’t establish that the whole rollout will hold up, tell you what adoption looks like across teams, or predict renewal. If the workflow is seasonal, rare, or different for each operator, agree when you can test a representative case. The purpose of the check is smaller. Decide which piece of work the customer can take over on the terms you’ve agreed, and keep the next handoff honest.</p>
      <h2>Sources and methodology</h2>
      <ul>
      <li><a href="https://handbook.gitlab.com/handbook/customer-experience/csm/success-plans/">GitLab’s public Success Plans handbook</a> describes a company practice of recording customer goals, milestones and ownership in a shared plan. It provides context for where to record the handoff decision.</li>
      <li><a href="https://www.gov.uk/service-manual/agile-delivery/how-the-beta-phase-works">The GOV.UK Service Manual on beta delivery</a> describes testing with real users, starting with a limited audience and planning for support. That guidance informs the idea of testing real work in a bounded setting.</li>
      </ul>
      <p>The Second Run Check is an editorial proposal for a single handoff decision. The Friday report example is fictional. The sources describe operating practices and provide no validation of this worksheet as a measure of retention.</p>
