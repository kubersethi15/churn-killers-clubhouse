uthority because their input is important.\n\nApplied carefully to Customer Success, the lesson is not that every company should use Scrum. It is that customer evidence and product authority are different things.\n\nCS should be accountable for the quality of the customer evidence it brings. Product should retain accountability for the product trade-off. Engineering should retain authority over delivery and technical quality.\n\nGitLab's public guidance on directly responsible individuals uses a similar separation. Its DRI has final decision power, consults relevant stakeholders and remains one accountable person. The handbook gives product prioritisation and engineering delivery as examples of different ownership.\n\nThat is the missing move in many cross-functional CS workflows: name the decision, then name the person who can actually make it.\n\n## Inspect the work before you reassign it\n\nNot every overloaded task needs a new owner. Some work should disappear.\n\nGoogle's Site Reliability Engineering guidance uses the word **toil** for operational work that tends to be manual, repetitive, automatable, tactical, without enduring value and increasingly expensive as the service grows. It warns that excessive toil can blur a team's role, slow progress and create a precedent for other teams to shift more operational work onto it.\n\nThat definition belongs to SRE. Churn Is Dead is applying its attributes as a diagnostic for CS work, not importing Google's staffing targets.\n\nAsk whether the recurring task:\n\n- requires a person to copy information between systems;\n- repeats without improving the underlying process;\n- could be automated or designed away;\n- arrives as an interruption rather than part of a deliberate customer plan;\n- produces another update but leaves the customer problem unchanged;\n- grows in direct proportion to account count.\n\nIf several are true, assigning the task to a different function may only relocate the waste. Remove, automate or re       <p style="font-size:11px;letter-spacing:3px;color:#C8553D;font-weight:bold;text-transform:uppercase">CHURN IS DEAD</p>
      <h1 style="font-family:Helvetica,Arial,sans-serif;font-size:32px">Stop Giving Senior CSMs Work They Cannot Decide</h1>
      <p style="color:#999;font-size:13px">8 min read · Leadership</p>
      <p><strong>Illustrative scenario:</strong> a senior CSM starts the week with five customer problems.</p>
      <p>A support incident needs a technical answer. A roadmap request needs a product decision. A security review needs evidence from Engineering. A renewal concession needs Finance and Sales approval. A stalled onboarding needs a revised customer plan.</p>
      <p>By Friday, all five tasks are assigned to the CSM.</p>
      <p>The CSM can chase every owner. They can assemble the context, reassure the customer, schedule the meeting and rewrite the update. They cannot decide the product priority, resolve the incident, approve the concession or produce the security evidence.</p>
      <p>Yet when somebody asks who owns each problem, the team points to the person closest to the customer.</p>
      <p>That is not customer centricity. It is an authority problem disguised as ownership.</p>
      <p>Senior CSMs should own consequential customer work. They should not become the default owner for every consequential thing a customer mentions.</p>
      <p>The distinction is simple: <strong>customer proximity creates responsibility for context. It does not create authority over every decision.</strong></p>
      <h2>“Own the outcome” is incomplete advice</h2>
      <p>“Own the outcome” sounds decisive. It is also vague enough to load an entire company onto one role.</p>
      <p>An outcome can depend on product priority, technical execution, contract terms, budget, security policy and customer behaviour. The CSM can influence all of them. Influence is not final authority, specialist capability or control of resources.</p>
      <p>A useful operating model separates four things:</p>
      <p>1. <strong>The customer consequence:</strong> what happens if the work is late, wrong or absent.</p>
      <p>2. <strong>The binding decision:</strong> the choice that changes the state of the problem.</p>
      <p>3. <strong>The decision authority:</strong> the person who can make that choice and control the required resources.</p>
      <p>4. <strong>The CSM contribution:</strong> the evidence, recommendation, coordination or communication CS should provide.</p>
      <p>Without that separation, the CSM receives accountability without authority. The task stays open, the customer keeps asking, and every delay appears to be a CS execution problem.</p>
      <h2>Public operating models already separate the roles</h2>
      <p>GitLab&#x27;s public CSM services handbook describes CSM work that includes success roadmaps, adoption milestones, executive reviews, enablement and internal advocacy. It calls the CSM a customer champion and a liaison to other teams.</p>
      <p>The same page draws a boundary around technical implementation. For infrastructure upgrades, it says CSMs may provide high-level guidance while implementation should ideally be handled by Professional Services.</p>
      <p>That is one company&#x27;s operating model, not a universal definition of Customer Success. But the distinction is useful: a CSM can own customer continuity and still not own specialist execution.</p>
      <p>GitLab&#x27;s separate Support guidance follows the same pattern. The CSM helps establish support access, improves ticket quality, reviews tickets and relays feedback. Support processes and engineers handle the technical resolution path.</p>
      <p>The boundary is not “CS stops caring.” The boundary specifies how CS contributes without pretending to be the technical owner.</p>
      <h2>The person who supplies evidence is not automatically the decision owner</h2>
      <p>The Scrum Guide makes this distinction explicit in product work. It assigns the Product Owner accountability for product value and Product Backlog management, including ordering backlog items. The Product Owner may delegate work, but remains accountable. Stakeholders who want the backlog changed try to convince the Product Owner; they do not inherit backlog authority because their input is important.</p>
      <p>Applied carefully to Customer Success, the lesson is not that every company should use Scrum. It is that customer evidence and product authority are different things.</p>
      <p>CS should be accountable for the quality of the customer evidence it brings. Product should retain accountability for the product trade-off. Engineering should retain authority over delivery and technical quality.</p>
      <p>GitLab&#x27;s public guidance on directly responsible individuals uses a similar separation. Its DRI has final decision power, consults relevant stakeholders and remains one accountable person. The handbook gives product prioritisation and engineering delivery as examples of different ownership.</p>
      <p>That is the missing move in many cross-functional CS workflows: name the decision, then name the person who can actually make it.</p>
      <h2>Inspect the work before you reassign it</h2>
      <p>Not every overloaded task needs a new owner. Some work should disappear.</p>
      <p>Google&#x27;s Site Reliability Engineering guidance uses the word <strong>toil</strong> for operational work that tends to be manual, repetitive, automatable, tactical, without enduring value and increasingly expensive as the service grows. It warns that excessive toil can blur a team&#x27;s role, slow progress and create a precedent for other teams to shift more operational work onto it.</p>
      <p>That definition belongs to SRE. Churn Is Dead is applying its attributes as a diagnostic for CS work, not importing Google&#x27;s staffing targets.</p>
      <p>Ask whether the recurring task:</p>
      <ul>
      <li>requires a person to copy information between systems;</li>
      <li>repeats without improving the underlying process;</li>
      <li>could be automated or designed away;</li>
      <li>arrives as an interruption rather than part of a deliberate customer plan;</li>
      <li>produces another update but leaves the customer problem unchanged;</li>
      <li>grows in direct proportion to account count.</li>
      </ul>
      <p>If several are true, assigning the task to a different function may only relocate the waste. Remove, automate or redesign it.</p>
      <h2>The Work Ownership Decision Matrix</h2>
      <p>Use four modes instead of a binary argument about whether CS “owns” the customer.</p>
      <h3>1. Own</h3>
      <p>CS owns the work when the CSM has authority to make the decision, the capability to execute it and a clear customer obligation.</p>
      <p>Examples may include the success-plan cadence, stakeholder engagement plan, adoption hypothesis, value-review preparation and the customer communication CS has explicitly committed to deliver.</p>
      <p>Ownership still needs a boundary: the outcome, the decision the CSM can make and the point at which another function&#x27;s authority begins.</p>
      <h3>2. Prepare</h3>
      <p>CS prepares when another function owns the binding decision but needs customer evidence or a recommendation.</p>
      <p>For a product request, CS can define the affected user, workflow, consequence, frequency, workaround and customer decision date. Product decides priority. For a commercial exception, CS can document customer context and consequence. The authorised commercial owner decides the concession.</p>
      <p>Preparation is not passive. Weak evidence delays decisions. But the CSM&#x27;s deliverable is the decision-quality packet, not the decision itself.</p>
      <h3>3. Coordinate</h3>
      <p>CS coordinates when a cross-functional handoff needs temporary continuity for the customer.</p>
      <p>Coordination must be time-bounded. Record the operational owner, decision date, customer update cadence, escalation path and a <strong>stop rule</strong>: the observable event after which CS no longer runs the internal workflow.</p>
      <p>Without a stop rule, coordination becomes permanent shadow ownership.</p>
      <h3>4. Remove</h3>
      <p>Remove work when it is repetitive, duplicated, automatable or produces no durable improvement.</p>
      <p>Examples may include manually copying status between systems, rebuilding the same internal report, scheduling a recurring meeting with no decision, or translating updates that could be generated from a shared record.</p>
      <p>Do not ask which senior person should inherit it. Ask why the task still exists.</p>
      <h2>Run one ownership review</h2>
      <p>Choose one task that lands with a senior CSM at least monthly.</p>
      <p>Write down:</p>
      <ul>
      <li>the exact customer consequence;</li>
      <li>the binding decision or required execution;</li>
      <li>the budget, system access, specialist capability or policy authority required;</li>
      <li>the person who controls those resources;</li>
      <li>the CSM&#x27;s useful contribution;</li>
      <li>whether the work should be owned, prepared, coordinated or removed.</li>
      </ul>
      <p>If the mode is Prepare or Coordinate, create a handoff record:</p>
      <p><strong>Rightful DRI. CSM input. Decision date. Customer communication owner. Escalation path. Stop rule.</strong></p>
      <p>Then test the boundary at the next occurrence. Did the rightful owner decide? Did the customer receive a clear answer? Did the task quietly return to the CSM two days later?</p>
      <p>Do not redesign the entire CS role from a workshop. Fix one recurring ownership mismatch and observe what changes.</p>
      <p>The goal is not to make senior CSMs less accountable. It is to make their accountability credible.</p>
      <p><a href="/pdfs/Work_Ownership_Decision_Matrix_ChurnIsDead.pdf">Download the Work Ownership Decision Matrix</a></p>
      <h2>Sources and methodology</h2>
      <p>This issue proposes a Churn Is Dead operating model. The four modes, authority test, handoff fields and stop rule are original proposals, not industry benchmarks. The model draws on the definition and organisational effects of toil in <a href="https://sre.google/sre-book/eliminating-toil/">Google&#x27;s SRE guidance</a>, the separation of stakeholder input from Product Owner accountability in the <a href="https://scrumguides.org/scrum-guide.html">2020 Scrum Guide</a>, GitLab&#x27;s public guidance on <a href="https://handbook.gitlab.com/handbook/people-group/directly-responsible-individuals/">directly responsible individuals</a>, and GitLab&#x27;s public examples of CSM boundaries in <a href="https://handbook.gitlab.com/handbook/customer-success/csm/services/">CSM responsibilities and services</a> and <a href="https://handbook.gitlab.com/handbook/customer-success/csm/support/">CSM and Support interaction</a>. Sources were reviewed on 24 August 2026.</p>
