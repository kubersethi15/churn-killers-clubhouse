      <p style="font-size:11px;letter-spacing:3px;color:#C8553D;font-weight:bold;text-transform:uppercase">CHURN IS DEAD</p>
      <h1 style="font-family:Helvetica,Arial,sans-serif;font-size:32px">What Sprint Planning Can Teach CS About Product Friction</h1>
      <p style="color:#999;font-size:13px">8 min read · Operations</p>
      <p>Product friction rarely enters the roadmap as a clean decision.</p>
      <p>It arrives as a screenshot in Slack. A CSM says a renewal is at risk. Sales adds another logo to the thread. Product asks for evidence. CS hears delay. Product hears pressure.</p>
      <p>Then the request joins a backlog with no agreed decision, no owner, and no honest expectation for the customer.</p>
      <p>The problem is not that Product has never heard the voice of the customer. The problem is that hearing a complaint and making a product decision are different jobs.</p>
      <p>Customer Success needs a better way to close the gap between those two jobs.</p>
      <p>Not a louder escalation channel. Not a fake promise that every renewal risk gets roadmap priority. A simple review that helps CS explain the customer problem clearly and lets Product give an honest answer.</p>
      <p>Call it the <strong>Product Friction Review</strong>.</p>
      <p>It borrows one useful principle from sprint planning: a team should enter a planning conversation with a goal, prepared work, and an honest view of capacity. It does not turn CS into a product owner. It makes CS responsible for the quality of the customer evidence it brings.</p>
      <h2>What sprint planning actually contributes</h2>
      <p>The official <a href="https://scrumguides.org/scrum-guide.html">Scrum Guide</a> describes Sprint Planning around three questions: why the sprint is valuable, what can be done, and how the chosen work will get done. The resulting Sprint Backlog contains a goal, selected backlog items, and a delivery plan. Developers use what they know about past performance and upcoming capacity to make a forecast.</p>
      <p>That is useful because it separates a backlog from a commitment.</p>
      <p>A product backlog can contain thousands of reasonable ideas. A sprint forecast contains the work a team has selected against a goal and its available capacity. Selection changes the status of the work.</p>
      <p>CS often collapses those states. A request is logged, so the customer assumes it is being considered. A Product manager acknowledges it, so the account team hears momentum. A target quarter appears in conversation, so it becomes a commitment.</p>
      <p>Nothing was actually decided.</p>
      <p>The lesson is not “give CS ten percent of every sprint.” That would be a universal capacity rule with no universal evidence behind it. The lesson is simpler: define what makes customer friction ready for a decision, then record the decision Product actually made.</p>
      <h2>Product keeps roadmap authority</h2>
      <p>This only works if Product retains the right to say no.</p>
      <p>GitLab offers a useful public example. Its <a href="https://handbook.gitlab.com/handbook/product/product-processes/customer-issues-prioritization-framework/">customer issues prioritisation framework</a> gives customer-facing teams a structured way to signal blockers, retention concerns, and commitments. The same page is explicit that those signals are inputs to planning, not strict ordering instructions. Product teams keep final prioritisation autonomy.</p>
      <p>That boundary matters.</p>
      <p>CS sees the customer consequence. Product sees dependencies, strategy, architecture, opportunity cost, and demand across the market. Neither view is complete on its own.</p>
      <p>The Product Friction Review is not a transfer of control. It is a contract about inputs and decisions:</p>
      <ul>
      <li>CS owns the customer evidence.</li>
      <li>Product owns the product decision.</li>
      <li>Both own the expectation that leaves the room.</li>
      </ul>
      <p>Without that contract, CS tries to win with commercial intensity. Product defends itself with backlog language. The customer gets ambiguity.</p>
      <h2>The five-part customer problem brief</h2>
      <p>A request enters the review only when it has a complete five-part brief.</p>
      <p>The packet has five fields.</p>
      <h3>1. The user consequence</h3>
      <p>Describe the workflow that is blocked or degraded. Name the user role, the action they are trying to complete, and what happens instead.</p>
      <p>“The customer needs SSO improvements” is not ready.</p>
      <p>“An administrator cannot apply access rules at the group level, so each user is maintained manually” is closer. It identifies a user, an action, and a consequence.</p>
      <h3>2. The evidence</h3>
      <p>Include reproducible steps, relevant screenshots or logs, affected product area, frequency, and the current behaviour. Separate what the customer said from what the account team inferred.</p>
      <p>If the request cannot be reproduced, say that. Uncertainty is allowed. Hidden uncertainty is not.</p>
      <h3>3. The commercial timing</h3>
      <p>Record the next decision the customer will make and when. That may be a renewal, rollout, security review, expansion, or executive checkpoint.</p>
      <p>Keep sensitive account information in the systems and notes designed for it. GitLab&#x27;s public guidance is a useful reminder here: customer-sensitive context belongs in internal notes, and a customer label is not a delivery promise. The review needs enough commercial context to understand urgency without copying customer names or contract values into broad product channels.</p>
      <h3>4. The workaround reality</h3>
      <p>Document the current workaround, who performs it, how often it is required, and why it is acceptable or unacceptable.</p>
      <p>Workarounds change priority. A painful workaround is not the same as no workaround. A workaround that violates a security policy is not the same as an inconvenient manual step.</p>
      <h3>5. The decision requested</h3>
      <p>Ask for one of four outcomes:</p>
      <ul>
      <li>commit to a defined next step;</li>
      <li>investigate before deciding;</li>
      <li>decline with a reason;</li>
      <li>return the packet for missing evidence.</li>
      </ul>
      <p>“Please prioritise” is not a decision request. It is an invitation to continue arguing.</p>
      <h2>The 30-minute review</h2>
      <p>The following cadence is a proposal, not an industry benchmark. Start weekly if the volume justifies it. Run it less often if it does not.</p>
      <p>Use thirty minutes:</p>
      <ul>
      <li>Five minutes to close overdue decisions.</li>
      <li>Ten minutes to accept or reject new decision packets.</li>
      <li>Ten minutes to discuss the few items that require a trade-off.</li>
      <li>Five minutes to confirm owners, dates, and customer communication.</li>
      </ul>
      <p>Do not read every open request. Do not let the meeting become product discovery theatre. Prepared packets are reviewed. Unprepared requests go back to the owner.</p>
      <p>Every accepted packet leaves with one decision state:</p>
      <ul>
      <li><strong>Committed:</strong> a defined next step has an owner and date.</li>
      <li><strong>Investigating:</strong> a named person will answer a specific unknown by a date.</li>
      <li><strong>Declined:</strong> Product has made a decision and recorded the reason.</li>
      <li><strong>Evidence needed:</strong> CS knows exactly what is missing.</li>
      </ul>
      <p>Declined is a valid state. Silence is not.</p>
      <h2>Measure decision latency, not fantasy delivery dates</h2>
      <p>The first useful metric is <strong>decision latency</strong>: the time between a complete packet entering the review and an explicit decision being recorded.</p>
      <p>It is not time to ship. It is not a promise to fix every issue quickly. It measures how long the organisation leaves a qualified customer problem in ambiguity.</p>
      <p>Start by measuring your baseline. Do not borrow a target from another company. Look at the distribution, not just the average. A small number of very old unresolved decisions can create more customer damage than a healthy median suggests.</p>
      <p>Then inspect the causes:</p>
      <ul>
      <li>packets arrive without evidence;</li>
      <li>no Product owner exists for the affected area;</li>
      <li>the decision maker misses the review;</li>
      <li>commercial urgency is asserted but not explained;</li>
      <li>investigations begin without an answer date;</li>
      <li>declined requests are kept alive because nobody wants to tell the customer.</li>
      </ul>
      <p>The metric is useful only if it changes those behaviours.</p>
      <p>Google SRE&#x27;s <a href="https://sre.google/workbook/error-budget-policy/">error-budget policy</a> illustrates the broader principle. A written policy turns a recurring cross-functional conflict into a repeatable decision process with agreed actions and escalation. The Product Friction Review uses that principle, not Google&#x27;s thresholds. Your organisation must choose its own decision rules.</p>
      <h2>An illustrative example</h2>
      <p>This is a constructed example, not a reported customer case.</p>
      <p>A customer says a permissions limitation will block a wider rollout. The original request asks Product to “fix permissions before renewal.”</p>
      <p>The five-part brief changes the conversation. It identifies the administrator workflow, shows the manual workaround, records the security review date, and asks whether Product will investigate a narrower group-level control.</p>
      <p>Product declines a broad permissions redesign. It accepts a short investigation into the narrower control and names the decision date. CS tells the customer what is being evaluated, what is not committed, and when the next answer will arrive.</p>
      <p>The customer did not get an instant roadmap promise. They got a credible process.</p>
      <p>That is the point.</p>
      <h2>Where this model fails</h2>
      <p>The Product Friction Review will not repair a product strategy that ignores its market. It will not create engineering capacity. It will not make every high-value customer request correct.</p>
      <p>It also fails when leaders corrupt the inputs:</p>
      <ul>
      <li>CS inflates risk to force priority.</li>
      <li>Product uses “need more evidence” as permanent deferral.</li>
      <li>Sales commitments appear after the commercial decision has already been made.</li>
      <li>Revenue amounts are stacked as if the largest account automatically has the best product argument.</li>
      <li>The meeting records activity but not decisions.</li>
      </ul>
      <p>The review depends on disciplined disagreement. CS must be able to say, “This is the customer consequence.” Product must be able to say, “This is the product trade-off.” Leadership must be able to resolve the small number of conflicts that neither side owns alone.</p>
      <h2>Start this week</h2>
      <p>Pick the ten oldest product requests attached to active customer conversations.</p>
      <p>Do not ask Product to rank them yet.</p>
      <p>For each one, complete the five-part customer problem brief. Remove the requests that have no clear user consequence. Mark the ones with missing evidence. Identify the requests that already have an answer nobody communicated.</p>
      <p>Then run one Product Friction Review.</p>
      <p>The goal is not to win more roadmap slots. The goal is to replace backlog ambiguity with decisions your customer team can stand behind.</p>
      <p><a href="/pdfs/Product_Friction_Review_ChurnIsDead.pdf">Download the Product Friction Review playbook</a></p>
      <h2>Sources and methodology</h2>
      <p>This issue proposes a Churn Is Dead review method. It does not claim that the cadence or metric is a universal benchmark. The method draws on the planning boundaries in the <a href="https://scrumguides.org/scrum-guide.html">official Scrum Guide</a>, the separation of customer input from Product autonomy in <a href="https://handbook.gitlab.com/handbook/product/product-processes/customer-issues-prioritization-framework/">GitLab&#x27;s customer issues framework</a> and <a href="https://handbook.gitlab.com/handbook/product/product-processes/">product process</a>, and the use of written cross-functional decision policies in <a href="https://sre.google/workbook/error-budget-policy/">Google SRE</a>. Sources were reviewed on 23 August 2026.</p>
