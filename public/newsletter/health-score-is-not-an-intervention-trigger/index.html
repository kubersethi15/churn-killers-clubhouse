      <h1 style="font-family:Helvetica,Arial,sans-serif;font-size:32px">A Health Score Is Not an Intervention Trigger</h1>
      <p style="color:#999;font-size:13px">8 min read · Measurement</p>
      <p><strong>Illustrative scenario:</strong> an account moves from green to yellow on Monday morning.</p>
      <p>The CSM opens the dashboard. Usage is down. Executive engagement is lower. Two support tickets are open. The composite score has crossed a threshold.</p>
      <p>The alert says <strong>Investigate account health</strong>.</p>
      <p>By Wednesday, the CSM has discovered that usage fell because the customer consolidated two environments, the executive sponsor missed one meeting while travelling, and both support tickets are routine. The alert created work, but it did not identify a customer consequence or a decision.</p>
      <p>On another account, a customer-confirmed implementation milestone has slipped twice. The health score is still green because product activity remains high and the score refreshes monthly.</p>
      <p>The dashboard noticed movement. It did not know when the team should intervene.</p>
      <p>A metric is not a signal. A signal is not a trigger. <strong>An intervention trigger is an observed customer condition connected to a pre-agreed response.</strong></p>
      <p>If an alert cannot tell the team what became consequential, why now matters, and who can act, it is only a request for more investigation.</p>
      <h2>Separate measurement, state, signal and trigger</h2>
      <p>CS systems often compress four different things into one colour.</p>
      <p><strong>Measurement</strong> is an observation: weekly active users, unresolved cases, stakeholder attendance, implementation tasks completed, or time since the customer last confirmed an outcome.</p>
      <p><strong>State</strong> is a summary of several observations: green, yellow, red, healthy, neutral or at risk.</p>
      <p><strong>Signal</strong> is a change that may matter: usage falls below its established range, an agreed milestone passes without evidence, a decision-maker leaves, or a commercial step remains unconfirmed near its deadline.</p>
      <p><strong>Trigger</strong> is the rule that converts that signal into action: when this condition occurs, over this window, with these exclusions checked, this owner takes this response by this time.</p>
      <p>The distinction matters because a health score can summarise an account without specifying the intervention. A CSM still has to unpack the score, locate the movement, decide whether it is meaningful, discover the cause and invent a response.</p>
      <p>That latency is the real measurement problem.</p>
      <h2>Start with customer consequence, not data availability</h2>
      <p>Google&#x27;s Site Reliability Engineering guidance separates symptoms from causes. In its domain, monitoring should identify what is broken for users before diagnosing why. It also argues that urgent alerts should be actionable and difficult to ignore safely.</p>
      <p>Customer Success should borrow the distinction carefully.</p>
      <p>“Logins fell 18%” is an observation. “The implementation team cannot complete the workflow required for the customer&#x27;s 30 September launch” is a consequence. The first may help investigate the second. It does not establish it.</p>
      <p>Start a trigger with the customer commitment or decision that could fail:</p>
      <ul>
      <li>a customer-confirmed implementation milestone;</li>
      <li>an outcome evidence date;</li>
      <li>a security or legal approval needed for deployment;</li>
      <li>a budget or procurement step needed for renewal;</li>
      <li>an executive decision the success plan depends on.</li>
      </ul>
      <p>Then ask which observable change gives the team enough time to protect that commitment.</p>
      <p>Do not start with the easiest metric in the platform. Data availability is not customer significance.</p>
      <h2>Define movement against a baseline</h2>
      <p>NIST&#x27;s guidance on control charts compares current process behaviour with an established baseline. It also makes the trade-off explicit: where a limit is placed changes the risk of investigating normal variation as though it has a special cause.</p>
      <p>Enterprise account activity is not a manufacturing process. It is often irregular, low-volume and shaped by planned events. A CSM should not paste three-sigma limits onto five monthly observations and call the result statistical control.</p>
      <p>The transferable discipline is simpler:</p>
      <p>1. Record what normal looked like for this customer, use case or lifecycle stage.</p>
      <p>2. Specify how much movement matters.</p>
      <p>3. Specify how long the movement must persist.</p>
      <p>4. List known conditions that make the movement benign.</p>
      <p>5. Treat the trigger as a reason to investigate or act, not proof of a cause.</p>
      <p>GitLab&#x27;s public product-usage playbooks show one practical version of this structure. They pair particular metrics with timing or movement conditions and then give the CSM discovery questions. The same guidance notes that a usage drop may have a benign explanation, such as project consolidation.</p>
      <p>That caveat is important. A trigger should open a bounded decision path. It should not manufacture certainty.</p>
      <h2>Design for false positives and missed signals</h2>
      <p>Google&#x27;s SRE Workbook evaluates alerts using four properties: precision, recall, detection time and reset time.</p>
      <p>Translated into CS operations:</p>
      <ul>
      <li><strong>Precision:</strong> how often did the trigger identify a condition that required the defined response?</li>
      <li><strong>Recall:</strong> how often did a consequential condition occur without the trigger firing?</li>
      <li><strong>Detection time:</strong> how much usable time remained between the trigger and the customer decision or consequence?</li>
      <li><strong>Reset time:</strong> how quickly did the account leave the triggered state after the condition was resolved or disproved?</li>
      </ul>
      <p>These questions expose weak alert design.</p>
      <p>A one-day engagement dip may fire quickly but create constant false alarms. A monthly score may be quieter but detect a missed milestone after the recovery window has closed. A trigger that never resets leaves the account permanently yellow, so the team learns to ignore it.</p>
      <p>Low-volume accounts need extra caution. One missed meeting can look like a 50% engagement collapse if only two meetings were scheduled. A single executive absence should not page an entire account team. The consequence and context determine whether it matters.</p>
      <h2>Build the Intervention Trigger Ledger</h2>
      <p>Use one row for each intervention the team expects a CSM or cross-functional owner to run.</p>
      <h3>1. Customer consequence</h3>
      <p>Name the commitment, outcome or decision at risk. Include its customer-confirmed date where one exists.</p>
      <p>Bad: adoption is declining.</p>
      <p>Better: the security team may miss the agreed date for completing its first production scan, delaying the customer&#x27;s launch decision.</p>
      <h3>2. Observable event</h3>
      <p>Record the smallest event that can be observed consistently. Include the source system, refresh cadence and evidence owner.</p>
      <p>Avoid blended scores here. Preserve the raw observation so another person can inspect it.</p>
      <h3>3. Baseline and window</h3>
      <p>State what normal means for this account, segment, use case or lifecycle stage. Then record the comparison window.</p>
      <p>If no credible baseline exists, label the trigger provisional. Do not hide uncertainty behind a global threshold.</p>
      <h3>4. Trigger rule</h3>
      <p>Write the rule as a complete sentence:</p>
      <p><strong>When [observable condition] persists for [window], before [customer consequence date], and [disqualifiers] are absent, create [response class].</strong></p>
      <p>Use three response classes:</p>
      <ul>
      <li><strong>Interrupt:</strong> a person must respond now because delay materially reduces recovery options.</li>
      <li><strong>Next working day:</strong> the condition matters, but does not justify disrupting current work.</li>
      <li><strong>Monitor:</strong> collect another observation before intervening.</li>
      </ul>
      <h3>5. Action and owner</h3>
      <p>An alert is incomplete without a first action that a named role can perform.</p>
      <p>“Investigate health” is not an action. “CSM confirms whether the milestone moved, records the customer&#x27;s reason, and routes a technical blocker to the implementation owner by Thursday” is.</p>
      <p>Name the cross-functional decision owner separately when CS cannot resolve the condition.</p>
      <h3>6. Disqualifiers and reset rule</h3>
      <p>List the known benign conditions: planned migration, seasonal shutdown, contractually reduced scope, test environment, data outage or a customer-confirmed schedule change.</p>
      <p>Then define what clears the trigger. Resolution, a disproved assumption, a new customer date or an explicit decision can all reset the state.</p>
      <p>Without a reset rule, yesterday&#x27;s risk becomes permanent dashboard decoration.</p>
      <h3>7. Review outcome</h3>
      <p>After each trigger, record only what improves the rule:</p>
      <ul>
      <li>consequential and correctly timed;</li>
      <li>consequential but late;</li>
      <li>benign movement;</li>
      <li>wrong owner or response;</li>
      <li>missed condition discovered elsewhere.</li>
      </ul>
      <p>Do not use the review to score the CSM. Use it to improve the trigger.</p>
      <h2>Replace one vague alert</h2>
      <p>Choose one alert that currently creates work for the team.</p>
      <p>Find its most recent five occurrences. For each one, ask:</p>
      <p>1. What customer consequence was actually at risk?</p>
      <p>2. What action did the alert cause?</p>
      <p>3. Could the owner act with the information available?</p>
      <p>4. Was the condition urgent, suitable for the next working day, or only worth monitoring?</p>
      <p>5. What cleared the alert?</p>
      <p>If the answers vary every time, the alert is not a trigger. It is an invitation to improvise.</p>
      <p>Build one row in the ledger and test it on the next occurrence. Keep the original health score if leaders still need a portfolio summary. Stop pretending that its colour is an intervention design.</p>
      <p>The goal is not to predict churn from every movement.</p>
      <p>It is to create enough justified notice for someone to protect a customer decision.</p>
      <p><a href="/pdfs/Intervention_Trigger_Ledger_ChurnIsDead.pdf">Download the Intervention Trigger Ledger</a></p>
      <h2>Sources and methodology</h2>
      <p>The Intervention Trigger Ledger, seven fields and three response classes are original Churn Is Dead proposals, not an industry standard or predictive model. The design draws on <a href="https://www.itl.nist.gov/div898/handbook/pmc/section3/pmc31.htm">NIST&#x27;s control-chart guidance</a> for baseline comparison and false-investigation risk, Google&#x27;s SRE guidance on <a href="https://sre.google/sre-book/monitoring-distributed-systems/">symptoms, causes and actionable alerts</a>, the SRE Workbook&#x27;s treatment of <a href="https://sre.google/workbook/alerting-on-slos/">precision, recall, detection time, reset time and low-volume alerting</a>, and one public company example in GitLab&#x27;s <a href="https://handbook.gitlab.com/handbook/customer-success/product-usage-data/metrics-based-playbooks/">product-usage playbooks</a>. Reliability-engineering methods are used as design analogies; the article does not claim that customer accounts behave like software services or statistically controlled manufacturing processes. Sources were reviewed on 24 August 2026.</p>
