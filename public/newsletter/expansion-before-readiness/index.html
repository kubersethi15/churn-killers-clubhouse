      <h1 style="font-family:Helvetica,Arial,sans-serif;font-size:32px">The Expansion Deal Your CS Team Should Slow Down</h1>
      <p style="color:#999;font-size:13px">7 min read · Customer Growth</p>
      <p>The customer wants to buy more. The paperwork can be signed this month. Sales is happy.</p>
      <p>Then someone asks who will get it up and running.</p>
      <p>The person who manages the system is still busy setting up the last purchase. The new department hasn&#x27;t agreed to change how it works. The person who approved the budget thinks all of that is sorted.</p>
      <p>This is a made-up example, not a customer story. But it raises a real question for Customer Success (CS): <strong>when should you slow down a deal the customer is willing to sign?</strong></p>
      <p>Not because expansion is bad. Not because every customer must reach some perfect adoption score before buying anything else.</p>
      <p>Because wanting to buy something isn&#x27;t the same as being ready to use it. If nobody checks the difference, the customer success manager ends up trying to keep a promise they didn&#x27;t make.</p>
      <p>I&#x27;d want CS involved before that happens. But with a specific objection and a workable alternative, not a vague feeling that the customer “isn&#x27;t ready”.</p>
      <h2>Buying more can be the right answer</h2>
      <p>First, ask why buying more makes sense.</p>
      <p>A new feature might solve the problem holding up the current setup. Extra licences might be needed for people already waiting to use the product. One department might be ready even while another is struggling. And if the customer waits, the budget might no longer be available.</p>
      <p>“They haven&#x27;t adopted everything they own” is not enough to reject an expansion. Customers don&#x27;t owe vendors maximum feature usage. They need a result worth paying for.</p>
      <p>The question is narrower: <strong>what must be true for this particular expansion to work, and which of those things has someone actually agreed to do?</strong></p>
      <p>Now there&#x27;s something concrete to discuss. Instead of arguing about whether Sales is pushing too hard, you can check whether the person doing the work has time to do it.</p>
      <p>Maybe the connection to the other system has already been tested. Maybe the customer has paid for help with setup. Maybe the new team can start without waiting for the old team&#x27;s problems to be fixed. If so, go ahead.</p>
      <p>Don&#x27;t hold up a good deal because a different part of the account has a problem.</p>
      <h2>What are we actually promising?</h2>
      <p>When a customer wants to buy more, I&#x27;d put two things next to each other: what they want to achieve, and the work needed to get there.</p>
      <p>“Add another department” tells you who&#x27;s included. It doesn&#x27;t tell you what those people will do differently, who will help them start or how you&#x27;ll know it&#x27;s working.</p>
      <p>You don&#x27;t need a new planning system for this. <a href="https://handbook.gitlab.com/handbook/solutions-architects/processes/customer-success-plan/">GitLab&#x27;s published process</a> puts the customer&#x27;s goals, the people involved and the steps to get started in a shared plan. That plan carries on after the sale. This is how one company organises the work, not proof that its approach keeps more customers.</p>
      <p>That&#x27;s the useful bit: the plan shouldn&#x27;t disappear once the deal closes.</p>
      <p><a href="https://learn.microsoft.com/en-us/microsoftteams/upgrade-define-project-scope">Microsoft&#x27;s guidance for moving to Teams</a> separates what will change, what the team wants to achieve and how it will check success. It also suggests considering a small trial to see whether the people and technology are ready. That&#x27;s advice for a particular software move, not a study of expansion deals. But the point is useful: agreeing what you want doesn&#x27;t mean you can do it yet.</p>
      <p>Neither source proves that slowing a deal leads to more revenue. What follows is a practical approach I&#x27;d suggest trying, not a proven formula.</p>
      <h2>Write down three things before the deal closes</h2>
      <p>Use the account notes or plan you already have. The one-page guide below is there to help the conversation, not give everyone another form to fill in.</p>
      <h3>What does the customer want to achieve?</h3>
      <p>Write down one thing the extra purchase should help the customer do. Then check it with the person who will actually run the work.</p>
      <p>The executive might want every department to use the same system. The team manager might want to stop copying numbers between spreadsheets every Friday. Both matter. But “everyone has an account” won&#x27;t tell you whether Friday&#x27;s work got any easier.</p>
      <p>Ask why it needs to happen now, too. What would waiting cost? You might not know the exact amount, and that&#x27;s fine. But don&#x27;t list every risk of starting while ignoring the cost of doing nothing.</p>
      <h3>What could stop it from working?</h3>
      <p>Pick the missing piece that could stop the work. You aren&#x27;t trying to fix every problem in the account before selling anything.</p>
      <p>It might be access to another system, someone&#x27;s time, a security approval or a feature that isn&#x27;t available yet. It could simply be that the customer hasn&#x27;t decided to stop doing things the old way.</p>
      <p>Find out who can sort it out and what needs to happen. “The customer will find someone” is a guess. “Their manager has agreed that Alex can spend two days on setup next week” is something you can plan around.</p>
      <p>Check your own side just as carefully. If the product can&#x27;t yet connect to a system the customer needs, their enthusiasm won&#x27;t change that. Don&#x27;t promise a date for a feature just because someone hopes it will be built soon.</p>
      <h3>What can we safely agree to now?</h3>
      <p>There are usually more options than signing the full rollout or walking away.</p>
      <p>You could start with one team, arrange help with setup, or buy now and start later. Sometimes it makes sense to wait until the missing piece is sorted. Any change to price, dates or contract terms needs the right people on both sides to agree. CS shouldn&#x27;t promise it on their behalf.</p>
      <p>Be clear about what you recommend: go ahead, start smaller, or wait. If you say wait, explain what needs to change and when you&#x27;ll check again. Otherwise “not ready” can leave a deal stuck for weeks, with nobody sure how to move it forward.</p>
      <h2>What that looks like in a real conversation</h2>
      <p>Here is a fictional example, not a reported account outcome.</p>
      <p>A customer wants three departments to use the same reporting product. The product can do the job. One department has someone free to set it up. The other two need their existing data cleaned up first, and nobody has been given that work.</p>
      <p>A weak objection is: “Adoption isn&#x27;t mature enough.” It gives the account owner nothing useful to work with.</p>
      <p>A better recommendation is:</p>
      <blockquote>I&#x27;d start with the first department. The other two need their data sorted out, and nobody has time set aside for that yet. Let&#x27;s agree who will do it before we promise their start dates.</blockquote>
      <p>The customer might not want to split the purchase. Their buying rules might require one order. The price might be different. Or they might be happy to pay now so they can start when their people are free.</p>
      <p>Fine. Just make sure everyone understands that choice. What are they buying now? What starts later? What happens if the data isn&#x27;t ready in time? Don&#x27;t say all three departments are ready just because someone can sign the order.</p>
      <p>If the customer frees up the right people tomorrow, change the plan tomorrow. The point is to make the work possible, not prove CS was right to say no.</p>
      <h2>Don&#x27;t turn CS into a second approvals committee</h2>
      <p>The obvious objection: aren&#x27;t we just slowing down deals that would have been fine?</p>
      <p>We could be. Nobody needs another meeting and a new score every time a customer buys a few more licences.</p>
      <p>Use this check when buying more also means changing how people work. A new department, a connection to another system or a promise of customer time that hasn&#x27;t been confirmed. If it&#x27;s just more people using something that already works, a quick check may be enough.</p>
      <p>CS doesn&#x27;t need the power to block every deal. It needs to explain a real risk to the people who can decide what to do about it. Include the customer in that conversation. Don&#x27;t make the decision for them in an internal meeting.</p>
      <p>Sales should be able to push back, too. What&#x27;s actually missing? What would fix it? What will waiting cost? If CS can&#x27;t answer those questions, “I&#x27;m worried” may not be a good enough reason to slow the deal.</p>
      <h2>Try it on one opportunity this week</h2>
      <p>Take one expansion that changes how the customer will work. Bring the account owner and the customer&#x27;s delivery lead into the same conversation.</p>
      <p>Use the <a href="/pdfs/Expansion_Decision_Note_ChurnIsDead.pdf">Expansion Decision Note</a> to write down what the customer wants, what&#x27;s missing and what you recommend. Add it to the account notes. Don&#x27;t start a separate tracker.</p>
      <p>Once the first piece of work is due, look back. Was the missing piece sorted out? Did the customer get the result they wanted? Did starting smaller help, or did this extra check just slow down a simple purchase? Be honest about both.</p>
      <p>One account won&#x27;t prove that this keeps customers longer. But it can show you whether you caught a problem worth asking about earlier next time.</p>
      <p><strong>The point isn&#x27;t to save customers from buying. It&#x27;s to stop a signed order being mistaken for a plan to make it work.</strong></p>
      <h2>Sources and methodology</h2>
      <ul>
      <li><a href="https://handbook.gitlab.com/handbook/solutions-architects/processes/customer-success-plan/">GitLab: Customer Success Plan</a>. First-party operating guidance on mutual planning across presales and postsales. Not comparative evidence of commercial results.</li>
      <li><a href="https://learn.microsoft.com/en-us/microsoftteams/upgrade-define-project-scope">Microsoft: Define the project scope for your Skype for Business to Microsoft Teams upgrade</a>. Context-specific migration guidance supporting the distinction between scope, readiness and success criteria. Its example targets are not benchmarks for CS.</li>
      </ul>
      <p>Accessed 27 September 2026. The decision note, recommendations and fictional example are original editorial proposals. No causal claim about revenue or churn is made, and no customer or employer experience is implied.</p>
